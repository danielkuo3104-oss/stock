<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股市助手 - 個人關注清單</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' }, stockRed: '#ef4444', stockGreen: '#22c55e' } } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-3 sm:px-8 py-3 w-full sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-star text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 dark:text-slate-100 flex items-center">個人專屬觀測清單</h1>
        </div>
      </div>
      <nav class="flex items-center space-x-4 sm:space-x-6 text-sm">
        <a href="index.html" class="text-slate-500 hover:text-brand-500 transition flex items-center space-x-1.5"><i class="fa-solid fa-arrow-left"></i><span>返回首頁</span></a>
        <button onclick="logout()" class="text-xs bg-slate-100 dark:bg-slate-800 hover:text-red-500 text-slate-500 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-right-from-bracket"></i></button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl">
      
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base sm:text-lg font-black flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-brand-500"></i>
          <span>我追蹤的標的</span>
        </h2>
        <span id="listCount" class="text-xs font-mono text-slate-400">載入中...</span>
      </div>

      <div class="overflow-x-auto overflow-y-auto max-h-[600px] rounded-xl border border-slate-200 dark:border-slate-800">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 dark:bg-slate-950 text-slate-600 dark:text-slate-400 font-semibold border-b border-slate-200 dark:border-slate-800 uppercase tracking-wider sticky top-0 z-10">
            <tr>
              <th class="py-2.5 px-3 text-center w-8">取消</th>
              <th class="py-2.5 px-3">標的名稱</th>
              <th class="py-2.5 px-3 text-right">收盤價</th>
              <th class="py-2.5 px-3 text-right">當日漲跌</th>
              <th class="py-2.5 px-3 text-right">漲跌幅</th>
              <th class="py-2.5 px-3 text-right hidden sm:table-cell">成交量</th>
              <th class="py-2.5 px-3 text-right hidden sm:table-cell">市值(億)</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono">
            <tr><td colspan="7" class="py-8 text-center text-slate-400 font-sans">正在同步試算表資料...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    const CSV_STOCKS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSENLLgR0CHFcaTBEQ3QLK0rdxmdaI8Fevn69-Mn3F-OwiMl1VRjMSvlXd3CSgRGj75Ob4JuU13nBf9/pub?gid=706377990&single=true&output=csv';
    let userWatchlist = new Set();
    let parsedStocks = [];

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
      loadWatchlist();
      fetchAndParseCsv();
    });

    function loadWatchlist() {
      try {
        const stored = localStorage.getItem('sectorpulse_watchlist');
        if (stored) userWatchlist = new Set(JSON.parse(stored));
      } catch (e) {}
    }

    function logout() {
      localStorage.removeItem('sectorpulse_user');
      window.location.href = 'index.html';
    }

    async function fetchAndParseCsv() {
      try {
        const res = await fetch(CSV_STOCKS_URL + '&_t=' + new Date().getTime());
        const text = await res.text();
        const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
        
        parsedStocks = [];
        for (let r = 1; r < lines.length; r++) {
          const row = parseCsvRow(lines[r]);
          const id = row[1] ? row[1].trim() : '';
          const name = row[2] ? row[2].trim() : '';
          const price = parseFloat(row[3]) || 0;
          const change = parseFloat(row[4]) || 0;
          const pctStr = row[5] ? row[5].trim() : '0.00%';
          const cap = parseFloat(row[6]) || 0;
          const volume = parseFloat(row[43]) || 0;

          if (id && id !== '-' && id !== '--') {
            parsedStocks.push({ id, name, price, change, pctStr, cap, volume });
          }
        }
        renderTable();
      } catch (e) {
        document.getElementById('stockTableBody').innerHTML = '<tr><td colspan="7" class="py-8 text-center text-red-500 font-sans">資料載入失敗，請稍後重試。</td></tr>';
      }
    }

    function parseCsvRow(text) {
      let p = '', c = false, r = [];
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"') {
          if (c && text[i+1] === '"') { p += '"'; i++; } else { c = !c; }
        } else if (char === ',' && !c) { r.push(p); p = ''; } else { p += char; }
      }
      r.push(p);
      return r;
    }

    function handleRemove(id) {
      userWatchlist.delete(id);
      localStorage.setItem('sectorpulse_watchlist', JSON.stringify(Array.from(userWatchlist)));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('stockTableBody');
      const filtered = parsedStocks.filter(s => userWatchlist.has(s.id));
      
      document.getElementById('listCount').textContent = `共 ${filtered.length} 檔`;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400 font-sans">您目前尚未加入任何星號關注個股，請至首頁探索！</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(s => {
        const isUp = s.change > 0;
        const isDown = s.change < 0;
        const priceColor = isUp ? 'text-stockRed' : (isDown ? 'text-stockGreen' : 'text-slate-500');
        const sign = isUp ? '+' : '';

        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-900/60 transition">
            <td class="py-2.5 px-3 text-center">
              <button onclick="handleRemove('${s.id}')" class="text-amber-400 hover:text-red-500 transition text-sm">
                <i class="fa-solid fa-star"></i>
              </button>
            </td>
            <td class="py-2.5 px-3">
              <div class="flex items-center space-x-1.5 font-sans">
                <span class="font-bold text-slate-900 dark:text-slate-100">${s.name}</span>
                <span class="text-[10px] text-slate-400 font-mono">${s.id}</span>
              </div>
            </td>
            <td class="py-2.5 px-3 text-right font-black ${priceColor}">${s.price.toFixed(2)}</td>
            <td class="py-2.5 px-3 text-right font-bold ${priceColor}">${sign}${s.change.toFixed(2)}</td>
            <td class="py-2.5 px-3 text-right font-black ${priceColor}">${s.pctStr.startsWith('+') || !isUp ? s.pctStr : '+'+s.pctStr}</td>
            <td class="py-2.5 px-3 text-right text-slate-600 dark:text-slate-300 hidden sm:table-cell">${s.volume.toLocaleString()}</td>
            <td class="py-2.5 px-3 text-right text-slate-500 dark:text-slate-400 hidden sm:table-cell">${s.cap.toFixed(1)}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
