  <script>
    const CSV_STOCKS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSENLLgR0CHFcaTBEQ3QLK0rdxmdaI8Fevn69-Mn3F-OwiMl1VRjMSvlXd3CSgRGj75Ob4JuU13nBf9/pub?gid=706377990&single=true&output=csv';
    // 高點追蹤 CSV 網址（與 index.html 相同；留空則不顯示）
    const CSV_HIGHS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSENLLgR0CHFcaTBEQ3QLK0rdxmdaI8Fevn69-Mn3F-OwiMl1VRjMSvlXd3CSgRGj75Ob4JuU13nBf9/pub?gid=1896125645&single=true&output=csv';
    const BACKEND_API_URL = 'https://script.google.com/macros/s/AKfycbyk4eJPQ6C7PdwBQ1p7WMWog52FPeSO7nFSk9lov_ZFR8mok5YkNbQ2cxvt2aZuEOzh/exec';
    const ADMIN_EMAIL = 'danielkuo3104@gmail.com';
    const TIER_LIMITS = { '初級韭菜': 20, '資深韭菜': 50, '萬年韭皇': Infinity };

    let currentUser = null;
    let userWatchlist = [];          // 保留加入順序
    let stockMap = new Map();        // id -> stock
    let dataLoaded = false;
    let highMap = {};

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initUser();
    });

    // ---------- 登入狀態（與首頁共用 localStorage / sessionStorage）----------
    function initUser() {
      const stored = sessionStorage.getItem('sectorpulse_user') || localStorage.getItem('sectorpulse_user');
      if (!stored) { window.location.replace('index.html'); return; }
      try {
        currentUser = JSON.parse(stored);
      } catch (e) { window.location.replace('index.html'); return; }
      if (currentUser.role === 'admin') currentUser.tier = '萬年韭皇';
      if (!currentUser.tier) currentUser.tier = '初級韭菜';
      renderUserBadge();
      syncProfile();

      if (currentUser.role === 'guest') {
        document.getElementById('lockedView').classList.remove('hidden');
        document.getElementById('dataTimestamp').textContent = '訪客模式';
        return;
      }

      let list = [];
      if (Array.isArray(currentUser.watchlist)) list = currentUser.watchlist;
      else {
        try { list = JSON.parse(localStorage.getItem('sectorpulse_watchlist') || '[]'); } catch (e) {}
      }
      userWatchlist = [...new Set(list.map(String))];

      document.getElementById('memberView').classList.remove('hidden');
      if (/^#(journal|alerts|track|notes)$/.test(location.hash)) setTimeout(() => switchPersonalTab(location.hash.slice(1)), 0);
      renderSummary();
      fetchStocks();
    }

    // 向後端同步最新等級（與首頁一致；管理員改等級後不必重新登入）
    async function syncProfile() {
      if (!currentUser || !currentUser.token || currentUser.role === 'guest') return;
      try {
        const res = await fetch(BACKEND_API_URL, { method: 'POST', body: JSON.stringify({ action: 'me', email: currentUser.email, token: currentUser.token }) });
        const r = await res.json();
        if (!r || !r.success || !r.user) return;
        Object.assign(currentUser, { tier: r.user.tier, role: r.user.role, name: r.user.name || currentUser.name, hasJournal: r.user.hasJournal });
        const key = 'sectorpulse_user';
        if (localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify(currentUser));
        else if (sessionStorage.getItem(key)) sessionStorage.setItem(key, JSON.stringify(currentUser));
        renderUserBadge();
        if (typeof renderSummary === 'function' && document.getElementById('quotaBox')) renderSummary();
      } catch (e) {}
    }

    function renderUserBadge() {
      const el = document.getElementById('userBadge');
      const tier = currentUser.tier || '初級韭菜';
      if (currentUser.role === 'admin') {
        el.innerHTML = `<i class="fa-solid fa-shield-halved mr-1 text-blue-600 dark:text-blue-400"></i><span>${escHtml(currentUser.name)} (管理員 · 韭皇)</span>`;
        el.className = 'text-[10px] sm:text-xs px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full font-bold bg-blue-50 dark:bg-blue-500/15 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-500/40 whitespace-nowrap inline-flex items-center';
      } else if (currentUser.role === 'guest') {
        el.innerHTML = `<i class="fa-solid fa-user-secret mr-1"></i><span>訪客</span>`;
        el.className = 'text-[10px] sm:text-xs px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 whitespace-nowrap inline-flex items-center';
      } else {
        const icon = tier === '萬年韭皇' ? 'fa-crown text-purple-500' : (tier === '資深韭菜' ? 'fa-gem text-amber-500' : 'fa-seedling text-emerald-500');
        el.innerHTML = `<i class="fa-solid ${icon} mr-1.5"></i><span class="hidden sm:inline">${escHtml(currentUser.name)} </span><span>(${escHtml(tier)})</span>`;
        el.className = 'text-[10px] sm:text-xs px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 whitespace-nowrap inline-flex items-center';
      }
    }

    function logout() {
      try {
        if (currentUser && currentUser.token) {
          fetch(BACKEND_API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', token: currentUser.token }) }).catch(() => {});
        }
      } catch (e) {}
      localStorage.removeItem('sectorpulse_user');
      sessionStorage.removeItem('sectorpulse_user');
      localStorage.removeItem('sectorpulse_watchlist');
      window.location.href = 'index.html';
    }

    // ---------- 主題 / 字級（與首頁共用設定）----------
    function initTheme() {
      const isDark = localStorage.getItem('theme') !== 'light';
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      applyLargeFontState(localStorage.getItem('largeFont') === 'true');
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }
    function toggleLargeFont() {
      const isLarge = !document.documentElement.classList.contains('large-font');
      localStorage.setItem('largeFont', isLarge ? 'true' : 'false');
      applyLargeFontState(isLarge);
    }
    function applyLargeFontState(isLarge) {
      document.documentElement.classList.toggle('large-font', isLarge);
      const btn = document.getElementById('btnLargeFont');
      const text = document.getElementById('largeFontText');
      btn.className = isLarge
        ? 'px-2 py-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-brand-500 text-white shadow-md shadow-brand-500/30 transition text-[10px] sm:text-xs font-bold flex items-center space-x-1 border border-brand-400'
        : 'px-2 py-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 transition text-[10px] sm:text-xs font-bold flex items-center space-x-1 border border-transparent';
      if (text) text.textContent = isLarge ? '標準' : '大字';
    }

    // ---------- 工具 ----------
    // ---------- 資料新鮮度（與首頁同規則）：個股報價依 L 欄「執行戳記」判斷 ----------
    const PF_HOLIDAYS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSENLLgR0CHFcaTBEQ3QLK0rdxmdaI8Fevn69-Mn3F-OwiMl1VRjMSvlXd3CSgRGj75Ob4JuU13nBf9/pub?gid=349903105&single=true&output=csv';
    let pfHolidays = null, pfStockDate = '', pfStockNewest = '', pfLoadTime = '';
    function pfNormDate(str) { const m = String(str ?? '').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : ''; }
    function pfToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
    function pfNowMin() { const d = new Date(Date.now() + 8 * 3600e3); return d.getUTCHours() * 60 + d.getUTCMinutes(); }
    function pfShort(d) { return d ? d.slice(5).replace('-', '/') : '--'; }
    function pfMmddToIso(txt) {
      const full = pfNormDate(txt); if (full) return full;
      const m = String(txt || '').match(/(\d{1,2})\/(\d{1,2})/); if (!m) return '';
      const t = pfToday(), y = +t.slice(0, 4);
      let iso = `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
      return iso > t ? `${y - 1}${iso.slice(4)}` : iso;
    }
    function pfIsTradingDay(iso) {
      const wd = new Date(iso + 'T12:00:00+08:00').getUTCDay();
      if (wd === 0 || wd === 6) return false;
      return !(pfHolidays || []).includes(iso);
    }
    function pfPrevTradingDay(iso) {
      let t = Date.parse(iso + 'T12:00:00+08:00');
      for (let i = 0; i < 20; i++) { t -= 86400e3; const d = new Date(t + 8 * 3600e3).toISOString().slice(0, 10); if (pfIsTradingDay(d)) return d; }
      return '';
    }
    function pfFresh(date) {
      if (!date) return { lv: 'unknown', text: '日期未知' };
      const t = pfToday();
      if (date === t) return { lv: 'today', text: '當日' };
      const closed = !pfIsTradingDay(t);
      const exp = closed ? pfPrevTradingDay(t) : (pfNowMin() >= 14 * 60 + 30 ? t : pfPrevTradingDay(t));
      if (date >= exp) return { lv: 'latest', text: closed ? '最近交易日' : '前一交易日' };
      return { lv: 'stale', text: '非當日' };
    }
    const PF_CLS = { today: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20', latest: 'bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20', stale: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30', unknown: 'bg-slate-200/70 dark:bg-slate-800 text-slate-500' };
    function pfBadge(date, prefix) {
      const f = pfFresh(date);
      const txt = (prefix ? prefix + ' ' : '') + (f.lv === 'today' || f.lv === 'unknown' ? f.text : pfShort(date) + ' ' + f.text);
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold whitespace-nowrap align-middle ${PF_CLS[f.lv]}">${escHtml(txt)}</span>`;
    }
    async function pfLoadHolidays() {
      if (pfHolidays) return;
      try {
        const res = await fetch(PF_HOLIDAYS_URL);
        const text = await res.text();
        pfHolidays = text.split(/\r\n|\n/).slice(1).map(l => pfNormDate(parseCsvRow(l)[0] || '')).filter(Boolean);
      } catch (e) { pfHolidays = []; }
    }
    function pfRenderFresh() {
      const ts = document.getElementById('dataTimestamp');
      if (ts && pfStockDate) ts.textContent = `個股 ${pfShort(pfStockDate)} ${pfFresh(pfStockDate).text}${pfLoadTime ? '・讀取 ' + pfLoadTime : ''}`;
      const wf = document.getElementById('watchFresh');
      if (wf) wf.innerHTML = pfStockDate ? pfBadge(pfStockDate, '報價') : '';
    }

    function escHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    function parseCsvRow(text) {
      let p = '', c = false, r = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (c && text[i + 1] === '"') { p += '"'; i++; } else { c = !c; }
        } else if (ch === ',' && !c) { r.push(p); p = ''; }
        else p += ch;
      }
      r.push(p);
      return r;
    }
    function roundToTick(price) {
      if (price <= 0 || isNaN(price)) return 0;
      let tick = 0.01;
      if (price < 10) tick = 0.01;
      else if (price < 50) tick = 0.05;
      else if (price < 100) tick = 0.1;
      else if (price < 500) tick = 0.5;
      else if (price < 1000) tick = 1.0;
      else tick = 5.0;
      return Math.round(price / tick) * tick;
    }

    async function handleRefresh() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      try { await fetchStocks(); } finally { setTimeout(() => icon.classList.remove('fa-spin'), 600); }   // fetchStocks 內含高點追蹤
    }

    // ---------- 讀取個股資料（與首頁同一張工作表、同樣欄位定義）----------
    async function fetchStocks() {
      if (!currentUser || currentUser.role === 'guest') return;
      await pfLoadHolidays();
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 15000);
        let text = '';
        try {
          const res = await fetch(CSV_STOCKS_URL + '&_t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          text = await res.text();
        } finally { clearTimeout(timer); }
        if (!text || /^\s*<(!doctype|html)/i.test(text)) throw new Error('非 CSV 內容');
        parseStocks(text);
        if (stockMap.size === 0) throw new Error('無個股資料');
        dataLoaded = true;
        await Promise.all([loadHighs(), loadDisposal()]);
        applyDisposal();
        try { renderWatchAlerts(); } catch (e) {}
      } catch (e) {
        if (dataLoaded) return;   // 已有舊資料則保留畫面
        document.getElementById('dataTimestamp').textContent = '資料讀取失敗';
        document.getElementById('watchCardsGrid').innerHTML = '<div class="col-span-full py-10 text-center text-xs text-amber-600 dark:text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i>個股資料暫時無法取得，請稍後按右上角刷新</div>';
        return;
      }
      renderSummary();
      renderWatchCards();
    }

    // 高點追蹤：讀不到時靜默略過，不影響關注清單
    async function loadHighs() {
      if (!CSV_HIGHS_URL) return;
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 12000);
        let text = '';
        try {
          const res = await fetch(CSV_HIGHS_URL + '&_t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
          if (res.ok) text = await res.text();
        } finally { clearTimeout(timer); }
        if (!text || /^\s*<(!doctype|html)/i.test(text)) return;
        const rows = text.split(/\r\n|\n/).filter(l => l.trim()).map(parseCsvRow);
        const hdr = rows[0].map(h => h.trim().replace(/\s+/g, ''));
        const ix = (...names) => { for (const n of names) { const i = hdr.indexOf(n); if (i >= 0) return i; } return -1; };
        const map = {};
        rows.slice(1).forEach(r => {
          const code = (r[ix('代號', '股票代號', '證券代號')] || '').trim();
          const prevHigh = Math.round(parseFloat(String(r[ix('前高', '前高價')] || '').replace(/,/g, '')) * 100) / 100;
          if (!code || !(prevHigh > 0)) return;
          map[code] = {
            prevHigh, prevDate: (r[ix('前高日期', '前高日')] || '').trim(), status: (r[ix('狀態', '註記')] || '').trim(),
            gap: parseFloat(r[ix('距前高%', '距前高')]), streak: parseInt(r[ix('連續新高', '連續天數')], 10) || 0
          };
          // 今日若突破，前高即更新為今日最高；距前高以目前最高計算
          const num = v => parseFloat(String(v || '').replace(/,/g, ''));
          const h = num(r[ix('最高', '最高價')]), c = num(r[ix('收盤', '收盤價')]);
          const recHigh = num(r[ix('區間最高')]), recDate = (r[ix('區間最高日')] || '').trim(), dataDate = (r[ix('資料日期')] || '').trim();
          const m = map[code];
          m.oldHigh = prevHigh; m.oldDate = m.prevDate; m.dayHigh = h; m.close = c; m.date = dataDate;
          if (h > prevHigh) {
            m.prevHigh = Math.round(Math.max(h, recHigh || 0) * 100) / 100;
            m.prevDate = (recHigh >= h && recDate) ? recDate : dataDate;
            m.broke = true;
          }
          if (c > 0) m.gap = (c / m.prevHigh - 1) * 100;
        });
        highMap = map;
      } catch (e) { console.warn('高點追蹤讀取失敗', e); }
    }
    // 高點追蹤與該檔報價同一天才顯示新高標籤
    function highSynced(s, h) { return !!(s && h && s.dataDate && pfNormDate(h.date) === s.dataDate); }
    function highBadgeHtml(h) {
      if (!h || !h.status) return '';
      const st = h.status.indexOf('達成新高') === 0 ? 'bg-amber-500 text-white font-black'
        : (h.status === '本日曾破新高' ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/40 font-bold' : 'bg-orange-500/10 text-orange-500 border border-orange-500/30 font-semibold');
      return `<span class="px-1.5 py-0.5 rounded text-[9px] whitespace-nowrap ${st}">${escHtml(h.status)}</span>`;
    }

    function parseStocks(csvText) {
      const grid = csvText.split(/\r\n|\n/).filter(l => l.trim() !== '').map(parseCsvRow);
      if (grid.length < 2) return;

      // 維護狀態 (AS11)
      let as11 = '';
      if (grid[10] && grid[10][44]) as11 = grid[10][44].trim();
      else if (grid[10] && grid[10][45]) as11 = grid[10][45].trim();
      const isMaint = as11.includes('維護') || as11.toLowerCase().includes('maint');
      document.getElementById('maintenanceOverlay').classList.toggle('hidden', !(isMaint && currentUser.role !== 'admin'));

      const at2 = (grid[1] && grid[1][45]) ? grid[1][45].trim() : '';
      const now = new Date();
      const t = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
      pfLoadTime = t.slice(0, 5);
      document.getElementById('dataTimestamp').textContent = `讀取 ${t}`;

      const volHeaders = [], pctHeaders = [];
      for (let c = 34; c <= 43; c++) volHeaders.push(grid[0][c] ? grid[0][c].trim() : '');
      for (let c = 46; c <= 55; c++) {
        let d = grid[0][c] ? grid[0][c].trim() : '';
        if (!d || d.startsWith('D-') || !d.includes('/')) d = volHeaders[c - 46] || d;
        pctHeaders.push(d);
      }

      stockMap = new Map();
      for (let r = 1; r < grid.length; r++) {
        const row = grid[r];
        const id = row[1] ? row[1].trim() : '';
        if (!id || id === '-' || id === '--') continue;
        const rawGroup = row[0] ? row[0].trim() : '';
        const mainGroup = rawGroup.split(/[：:]/)[0].trim();

        if (stockMap.has(id)) {
          const s = stockMap.get(id);
          if (mainGroup && !s.groups.includes(mainGroup)) s.groups.push(mainGroup);
          continue;
        }

        const price = parseFloat(row[3]) || 0;
        const change = parseFloat(row[4]) || 0;
        const pctStr = row[5] ? row[5].trim() : '0.00%';
        const pctNum = parseFloat(pctStr.replace('%', '')) || 0;
        const volume = parseFloat(row[43]) || 0;
        const stampIso = pfMmddToIso(row[11] || '');
        const dataDate = (stampIso && !pfIsTradingDay(stampIso)) ? (pfPrevTradingDay(stampIso) || stampIso) : stampIso;   // 休市日執行 → 實際為前一交易日

        const tenDayHistory = [];
        for (let c = 46; c <= 55; c++) {
          const v = row[c] ? row[c].trim() : '';
          tenDayHistory.push({ date: pctHeaders[c - 46], numVal: parseFloat(v.replace('%', '')) || 0, hasData: v !== '' && v !== '-' && v !== 'nan' });
        }
        const tenDayVol = [];
        for (let c = 34; c <= 43; c++) {
          const v = row[c] ? row[c].trim() : '';
          tenDayVol.push({ date: volHeaders[c - 34], numVal: parseFloat(v) || 0, hasData: v !== '' && v !== '-' && v !== 'nan' });
        }

        const stock = {
          id, name: row[2] ? row[2].trim() : id, groups: mainGroup ? [mainGroup] : [],
          price, change, pctStr, pctNum, volume,
          cap: parseFloat(row[6]) || 0,
          note1: row[12] ? row[12].trim() : '',
          note2: row[13] ? row[13].trim() : '',
          turnover: volume * 1000 * price,
          isLimitUp: pctNum >= 9.5 && change > 0,
          isLimitDown: pctNum <= -9.5 && change < 0,
          tenDayHistory, tenDayVol, dataDate
        };
        computeDerived(stock);
        stockMap.set(id, stock);
      }
      const cnt = {};
      stockMap.forEach(st => { if (st.dataDate) cnt[st.dataDate] = (cnt[st.dataDate] || 0) + 1; });
      const ks = Object.keys(cnt).sort();
      pfStockNewest = ks[ks.length - 1] || '';
      pfStockDate = ks.reduce((a, k) => (!a || cnt[k] > cnt[a] || (cnt[k] === cnt[a] && k > a)) ? k : a, '');
      pfRenderFresh();
    }

    // 十日價格回推、累積漲幅、量比與動態標籤（規則與首頁相同）
    // ---------- 處置股／注意股（與首頁相同規則）：處置期間不顯示窒息量／量縮類標籤 ----------
    let pfDisposal = {}, pfNotice = {};
    const PF_DSP_VOL = ['窒息量', '量縮價跌', '量縮價漲', '持續量縮'];
    function pfRoc(t) {
      t = String(t || '').trim();
      let m = t.match(/^(\d{3,4})(\d{2})(\d{2})$/);
      if (m) return `${+m[1] < 1000 ? +m[1] + 1911 : m[1]}-${m[2]}-${m[3]}`;
      m = t.match(/(\d{2,4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
      return m ? `${+m[1] < 1000 ? +m[1] + 1911 : m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
    }
    async function pfJson(url, ms) {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), ms);
      try { const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(timer); }
    }
    async function loadDisposal() {
      let items = [], notices = [], src = {};
      try { const j = await pfJson(BACKEND_API_URL + '?action=disposal&_t=' + Date.now(), 20000); if (j && Array.isArray(j.items)) { items = j.items; notices = j.notices || []; src = j.sources || {}; } } catch (e) {}
      const ok = k => String(src[k] || '').indexOf('ok') === 0;
      if (!ok('tpexDisposal')) try {
        (await pfJson('https://www.tpex.org.tw/openapi/v1/tpex_disposal_information', 10000)).forEach(rec => {
          const keys = Object.keys(rec), val = k => String(rec[k] ?? '').trim(), all = keys.map(val).join(' ');
          const code = val(keys.find(k => /^(Code|SecuritiesCompanyCode)$/i.test(k)) || '');
          const pk = keys.find(k => /(\d{2,3}\/\d{1,2}\/\d{1,2}|\d{7,8})\s*[～~\-－至]\s*(\d{2,3}\/\d{1,2}\/\d{1,2}|\d{7,8})/.test(val(k)));
          if (!/^\d{4,6}[A-Z]?$/.test(code) || !pk) return;
          const p = val(pk).match(/(\d{2,3}\/\d{1,2}\/\d{1,2}|\d{7,8})\s*[～~\-－至]\s*(\d{2,3}\/\d{1,2}\/\d{1,2}|\d{7,8})/);
          const mm = all.match(/第.次處置|再次處置/);
          items.push({ code, level: /第二次|第三次|再次/.test(all) ? 2 : 1, measure: mm ? mm[0] : '處置', start: pfRoc(p[1]), end: pfRoc(p[2]), mkt: '上櫃' });
        });
      } catch (e) {}
      if (!ok('tpexNotice')) try {
        (await pfJson('https://www.tpex.org.tw/openapi/v1/tpex_trading_warning_information', 10000)).forEach(rec => {
          const keys = Object.keys(rec), val = k => String(rec[k] ?? '').trim();
          const code = val(keys.find(k => /^(Code|SecuritiesCompanyCode)$/i.test(k)) || '');
          if (/^\d{4}[A-Z]?$/.test(code)) notices.push({ code, mkt: '上櫃', date: pfRoc(val(keys.find(k => /Date/i.test(k)) || '')), reason: val(keys.find(k => /Information|Reason/i.test(k)) || '') });
        });
      } catch (e) {}
      const today = pfToday(), map = {};
      items.forEach(it => {
        if (!it.code || !it.end || it.end < today) return;
        const cand = { ...it, state: it.start <= today ? 'active' : 'upcoming' };
        const rank = x => (x.state === 'active' ? 10 : 0) + (x.level || 1);
        if (!map[it.code] || rank(cand) > rank(map[it.code])) map[it.code] = cand;
      });
      const latest = {}; notices.forEach(n => { if (n.date && (!latest[n.mkt] || n.date > latest[n.mkt])) latest[n.mkt] = n.date; });
      const nmap = {}; notices.forEach(n => { if (n.code && (!n.date || n.date === latest[n.mkt])) nmap[n.code] = n; });
      pfDisposal = map; pfNotice = nmap;
    }
    function applyDisposal() {
      stockMap.forEach(s => {
        s.badges = (s.badges || []).filter(b => !b.dsp);
        const d = pfDisposal[s.id], n = pfNotice[s.id];
        s.disposal = d || null; s.notice = n || null;
        if (n && !d) s.badges.unshift({ text: '注意股', dsp: true, color: 'bg-yellow-400/20 text-yellow-700 dark:text-yellow-300 border border-yellow-500/40 font-bold' });
        if (!d) return;
        if (d.state === 'active') {
          s.badges = s.badges.filter(b => !PF_DSP_VOL.includes(b.text));
          s.badges.unshift({ text: d.level >= 2 ? '再次處置' : '處置', dsp: true,
            color: d.level >= 2 ? 'bg-rose-700 text-white border border-rose-500 font-black' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/40 font-bold' });
        } else {
          s.badges.unshift({ text: '即將處置', dsp: true, color: 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/40 font-bold' });
        }
      });
    }

    function computeDerived(s) {
      const h = s.tenDayHistory;
      const prices = new Array(h.length);
      let lastIdx = -1;
      for (let i = h.length - 1; i >= 0; i--) { if (h[i].hasData) { lastIdx = i; break; } }
      if (lastIdx !== -1) {
        prices[lastIdx] = s.price;
        for (let i = lastIdx; i > 0; i--) {
          prices[i - 1] = h[i].hasData ? roundToTick(prices[i] / (1 + h[i].numVal / 100)) : prices[i];
        }
      }
      s.prices = prices;
      const base = (lastIdx !== -1 && h[0].hasData) ? prices[0] / (1 + h[0].numVal / 100) : (prices[0] || s.price);
      s.cumPct = base > 0 ? ((s.price - base) / base) * 100 : 0;

      const validVols = s.tenDayVol.filter(v => v.hasData && v.numVal > 0);
      const avgVol10 = validVols.length ? validVols.reduce((a, v) => a + v.numVal, 0) / validVols.length : (s.volume || 1);
      s.avgVol10 = avgVol10;
      s.volRatio = s.volume / (avgVol10 || 1);

      const pct = s.pctNum, badges = [];
      const isSurge = s.volRatio >= 2.0 && s.volume >= 500;
      const isHeavy = s.volRatio >= 1.3 && s.volume >= 300;
      const isDry = s.volRatio <= 0.35 && avgVol10 >= 300;
      const isShrink = s.volRatio <= 0.65;
      const last3 = validVols.slice(-3);
      const validPcts = h.filter(x => x.hasData);
      let run = 0;
      const cum = validPcts.map(p => (run += p.numVal));
      const cumRange = cum.length === 10 ? Math.max(...cum) - Math.min(...cum) : 999;

      if (s.isLimitUp) badges.push({ text: '漲停', color: 'bg-limitUp text-white font-black' });
      else if (s.isLimitDown) badges.push({ text: '跌停', color: 'bg-limitDown text-white font-black' });
      if (pct >= 3.5 && isSurge) badges.push({ text: '爆量長紅', color: 'bg-red-600 text-white border border-red-400 font-black' });
      if (pct <= -3.5 && isSurge) badges.push({ text: '爆量長黑', color: 'bg-purple-700 text-white border border-purple-400 font-black' });
      if (pct >= 3.0 && isHeavy && !badges.some(b => b.text === '爆量長紅')) badges.push({ text: '量價齊揚', color: 'bg-red-500/15 text-stockRed border border-red-500/30 font-bold' });
      else if (pct <= -1.5 && isShrink) badges.push({ text: '量縮價跌', color: 'bg-sky-500/15 text-sky-400 border border-sky-500/30' });
      else if (pct >= 2.0 && isShrink) badges.push({ text: '量縮價漲', color: 'bg-amber-500/15 text-amber-500 border border-amber-500/30' });
      else if (pct <= -2.0 && isHeavy && !badges.some(b => b.text === '爆量長黑')) badges.push({ text: '帶量下殺', color: 'bg-rose-700/20 text-rose-500 border border-rose-600/30 font-bold' });
      if (isSurge && !badges.some(b => b.text.includes('長'))) badges.push({ text: '爆量', color: 'bg-amber-500/15 text-amber-500 border border-amber-500/40 font-bold' });
      else if (isDry) badges.push({ text: '窒息量', color: 'bg-slate-700 text-slate-100 border border-slate-500 font-bold' });
      if (pct >= 3.0 || s.isLimitUp) badges.push({ text: '強勢', color: 'bg-rose-500/15 text-rose-400 border border-rose-500/30' });
      if (pct <= -3.0 || s.isLimitDown) badges.push({ text: '弱勢', color: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' });
      if (last3.length === 3 && last3[2].numVal > last3[1].numVal && last3[1].numVal > last3[0].numVal) badges.push({ text: '持續量增', color: 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/30' });
      else if (last3.length === 3 && last3[2].numVal < last3[1].numVal && last3[1].numVal < last3[0].numVal) badges.push({ text: '持續量縮', color: 'bg-sky-500/15 text-sky-400 border border-sky-500/30' });
      if (validPcts.length === 10 && cumRange <= 4.0 && validPcts.every(d => Math.abs(d.numVal) <= 2.0)) badges.push({ text: '十日震盪整理', color: 'bg-teal-500/15 text-teal-400 border border-teal-500/30' });
      s.badges = badges;
    }

    // ---------- 摘要 ----------
    function renderSummary() {
      const tier = currentUser.tier || '初級韭菜';
      const limit = TIER_LIMITS[tier] ?? 20;
      const n = userWatchlist.length;
      const pctUsed = limit === Infinity ? 0 : Math.min((n / limit) * 100, 100);
      document.getElementById('quotaBox').innerHTML = `
        <div class="flex justify-between text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400 mb-1">
          <span>關注容量（${escHtml(tier)}）</span>
          <span class="font-mono font-bold text-slate-700 dark:text-slate-200">${n} / ${limit === Infinity ? '∞' : limit}</span>
        </div>
        <div class="h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full rounded-full ${pctUsed >= 90 ? 'bg-amber-500' : 'bg-brand-500'}" style="width:${limit === Infinity ? 100 : pctUsed}%"></div>
        </div>`;

      const stocks = userWatchlist.map(id => stockMap.get(id)).filter(Boolean);
      const up = stocks.filter(s => s.change > 0).length;
      const down = stocks.filter(s => s.change < 0).length;
      const flat = stocks.length - up - down;
      const avg = stocks.length ? stocks.reduce((a, s) => a + s.pctNum, 0) / stocks.length : null;
      const best = [...stocks].sort((a, b) => b.pctNum - a.pctNum)[0];
      const worst = [...stocks].sort((a, b) => a.pctNum - b.pctNum)[0];
      const col = v => v > 0 ? 'text-stockRed' : (v < 0 ? 'text-stockGreen' : 'text-slate-500');
      const fmt = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';

      const tile = (label, value, sub) => `
        <div class="bg-slate-100 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 min-w-0">
          <span class="text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400 block mb-1">${label}</span>
          <div class="text-base sm:text-lg font-black font-mono truncate">${value}</div>
          <div class="text-[10px] text-slate-400 truncate">${sub}</div>
        </div>`;

      document.getElementById('summaryTiles').innerHTML = !dataLoaded ? '' : [
        tile('今日漲跌家數', `<span class="text-stockRed">${up}</span><span class="text-slate-400 text-sm"> / </span><span class="text-stockGreen">${down}</span>`, `平盤 ${flat} 檔`),
        tile('平均漲跌幅', avg === null ? '--' : `<span class="${col(avg)}">${fmt(avg)}</span>`, '關注個股等權平均'),
        tile('今日最強', best ? `<span class="${col(best.pctNum)}">${fmt(best.pctNum)}</span>` : '--', best ? `${escHtml(best.name)} ${best.id}` : ''),
        tile('今日最弱', worst ? `<span class="${col(worst.pctNum)}">${fmt(worst.pctNum)}</span>` : '--', worst ? `${escHtml(worst.name)} ${worst.id}` : '')
      ].join('');
    }

    // ---------- 關注卡片 ----------
    function sparkline(s) {
      const pts = s.prices.map((p, i) => (s.tenDayHistory[i].hasData && p) ? { i, p } : null).filter(Boolean);
      if (pts.length < 2) return '<div class="h-10 flex items-center text-[10px] text-slate-400">暫無十日走勢</div>';
      const W = 120, H = 36, pad = 3;
      const min = Math.min(...pts.map(x => x.p)), max = Math.max(...pts.map(x => x.p));
      const range = (max - min) || 1;
      const xs = i => pad + (i / 9) * (W - pad * 2);
      const ys = p => H - pad - ((p - min) / range) * (H - pad * 2);
      const color = s.cumPct > 0 ? '#ef4444' : (s.cumPct < 0 ? '#22c55e' : '#94a3b8');
      const line = pts.map(x => `${xs(x.i).toFixed(1)},${ys(x.p).toFixed(1)}`).join(' ');
      const last = pts[pts.length - 1];
      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-10" preserveAspectRatio="none">
          <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <circle cx="${xs(last.i)}" cy="${ys(last.p)}" r="2.5" fill="${color}"/>
        </svg>`;
    }

    function renderWatchCards() {
      const grid = document.getElementById('watchCardsGrid');
      const info = document.getElementById('watchCountInfo');
      if (!dataLoaded) return;

      if (userWatchlist.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center space-y-3">
            <i class="fa-regular fa-star text-4xl text-slate-300 dark:text-slate-700"></i>
            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">尚未關注任何個股</p>
            <p class="text-xs text-slate-400">到首頁清單點擊左側 ⭐，或在個股詳情中加入關注</p>
            <a href="index.html" class="inline-block mt-2 px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition">前往首頁挑選</a>
          </div>`;
        info.textContent = '';
        return;
      }

      const q = document.getElementById('watchFilterInput').value.trim().toLowerCase();
      const sortKey = document.getElementById('watchSortSelect').value;

      let items = userWatchlist.map((id, order) => ({ id, order, s: stockMap.get(id) }));
      if (q) items = items.filter(({ id, s }) => id.toLowerCase().includes(q) || (s && (s.name.toLowerCase().includes(q) || s.groups.join(' ').toLowerCase().includes(q))));

      const val = (it, k) => it.s ? it.s[k] : -Infinity;
      if (sortKey === 'pctDesc') items.sort((a, b) => val(b, 'pctNum') - val(a, 'pctNum'));
      else if (sortKey === 'pctAsc') items.sort((a, b) => (a.s ? a.s.pctNum : Infinity) - (b.s ? b.s.pctNum : Infinity));
      else if (sortKey === 'cumDesc') items.sort((a, b) => val(b, 'cumPct') - val(a, 'cumPct'));
      else if (sortKey === 'volRatio') items.sort((a, b) => val(b, 'volRatio') - val(a, 'volRatio'));
      else if (sortKey === 'turnover') items.sort((a, b) => val(b, 'turnover') - val(a, 'turnover'));

      if (items.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-8 text-center text-xs text-slate-400">查無相符的關注標的</div>';
        info.textContent = `共關注 ${userWatchlist.length} 檔`;
        return;
      }

      grid.innerHTML = items.map(({ id, s }) => {
        const removeBtn = `<button onclick="event.stopPropagation(); removeFromWatchlist('${escHtml(id)}')" class="text-amber-400 hover:text-slate-400 transition text-sm shrink-0" title="取消關注"><i class="fa-solid fa-star"></i></button>`;
        if (!s) {
          return `
            <div class="p-4 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-between gap-2">
              <div>
                <div class="font-bold text-sm text-slate-700 dark:text-slate-200 font-mono">${escHtml(id)}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">目前資料表中查無此代號（可能已移出觀察名單）</div>
              </div>
              ${removeBtn}
            </div>`;
        }
        const col = s.change > 0 ? 'text-stockRed' : (s.change < 0 ? 'text-stockGreen' : 'text-slate-500 dark:text-slate-400');
        const cardTone = s.disposal ? 'border-orange-400/60 bg-orange-100/70 dark:bg-orange-500/10'
          : (s.notice ? 'border-yellow-400/60 bg-yellow-50 dark:bg-yellow-400/10'
          : (s.change > 0 ? 'border-red-500/25 bg-red-500/5' : (s.change < 0 ? 'border-emerald-500/25 bg-emerald-500/5' : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950')));
        const pctTxt = (s.change > 0 && !s.pctStr.startsWith('+')) ? '+' + s.pctStr : s.pctStr;
        const cumCol = s.cumPct > 0 ? 'text-stockRed' : (s.cumPct < 0 ? 'text-stockGreen' : 'text-slate-400');
        const priceBox = s.isLimitUp ? 'bg-limitUp text-white px-1.5 rounded' : (s.isLimitDown ? 'bg-limitDown text-white px-1.5 rounded' : col);
        const hi = highMap[s.id];
        const badges = (highSynced(s, hi) ? highBadgeHtml(hi) : '') + s.badges.map(b => `<span class="px-1.5 py-0.5 rounded text-[9px] whitespace-nowrap ${b.color}">${b.text}</span>`).join('');
        return `
          <div onclick="openStockDetail('${escHtml(id)}')" class="cursor-pointer p-4 rounded-2xl border ${cardTone} hover:shadow-lg hover:border-brand-500/60 transition space-y-2.5 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center space-x-2">
                  <span class="stock-name font-black text-base text-slate-900 dark:text-slate-100 truncate">${escHtml(s.name)}</span>
                  <span class="text-[10px] text-slate-400 font-mono">${escHtml(s.id)}</span>
                  ${(s.dataDate && pfStockNewest && s.dataDate < pfStockNewest) ? `<span class="px-1 rounded text-[9px] font-bold font-mono bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30" title="這檔的報價停在 ${s.dataDate}，比其他個股舊">${pfShort(s.dataDate)}</span>` : ''}
                </div>
                <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${escHtml(s.groups.join('、') || '—')}</div>
              </div>
              ${removeBtn}
            </div>

            <div class="flex items-end justify-between gap-3">
              <div class="shrink-0">
                <div class="stock-price text-xl font-black font-mono ${priceBox} inline-block">${s.price.toFixed(s.price >= 100 ? 1 : 2)}</div>
                <div class="text-xs font-bold font-mono ${col}">${s.change >= 0 ? '+' : ''}${s.change.toFixed(2)} (${escHtml(pctTxt)})</div>
              </div>
              <div class="flex-1 min-w-0 max-w-[140px]">${sparkline(s)}</div>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-[10px] font-mono text-center">
              <div class="bg-white/60 dark:bg-slate-900/60 rounded-lg py-1">
                <div class="text-slate-400 font-sans">十日累積</div>
                <div class="font-bold ${cumCol}">${s.cumPct > 0 ? '+' : ''}${s.cumPct.toFixed(2)}%</div>
              </div>
              <div class="bg-white/60 dark:bg-slate-900/60 rounded-lg py-1">
                <div class="text-slate-400 font-sans">成交量(張)</div>
                <div class="font-bold text-slate-700 dark:text-slate-200">${Math.round(s.volume).toLocaleString()}</div>
              </div>
              <div class="bg-white/60 dark:bg-slate-900/60 rounded-lg py-1">
                <div class="text-slate-400 font-sans">量比(10日)</div>
                <div class="font-bold ${s.volRatio >= 1.3 ? 'text-amber-500' : (s.volRatio <= 0.65 ? 'text-sky-500' : 'text-slate-700 dark:text-slate-200')}">${s.volRatio.toFixed(2)}x</div>
              </div>
            </div>

            ${hi ? `<div class="flex items-center justify-between text-[10px] font-mono bg-white/60 dark:bg-slate-900/60 rounded-lg px-2 py-1">
              <span class="text-slate-400 font-sans">區間前高 <strong class="text-slate-700 dark:text-slate-200 font-mono">${hi.prevHigh.toLocaleString('en-US', { maximumFractionDigits: 2 })}</strong> <span class="text-slate-400">${escHtml(/^\d{4}-\d{2}-\d{2}$/.test(hi.prevDate) ? hi.prevDate.slice(5).replace('-', '/') : '日期補查中')}</span>${hi.broke ? ' <span class="text-amber-500">今日創高</span>' : ''}</span>
              <span class="${isNaN(hi.gap) ? 'text-slate-400' : (hi.gap >= 0 ? 'text-stockRed' : 'text-stockGreen')} font-bold">距前高 ${isNaN(hi.gap) ? '--' : (hi.gap > 0 ? '+' : '') + hi.gap.toFixed(2) + '%'}</span>
            </div>` : ''}
            ${badges ? `<div class="flex flex-wrap gap-1">${badges}</div>` : ''}
          </div>`;
      }).join('');

      const missing = userWatchlist.filter(id => !stockMap.has(id)).length;
      info.textContent = `共關注 ${userWatchlist.length} 檔` + (q ? `，符合搜尋 ${items.length} 檔` : '') + (missing ? `（${missing} 檔查無資料）` : '');
    }

    let detailStockId = null;
    function closeStockDetail() {
      document.getElementById('stockDetailModal').classList.add('hidden');
      detailStockId = null;
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStockDetail(); });

    function fmtNum(v, d = 2) { return (v === null || v === undefined || isNaN(v)) ? '--' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
    function colOf(v) { return v > 0 ? 'text-stockRed' : (v < 0 ? 'text-stockGreen' : 'text-slate-500 dark:text-slate-400'); }
    function fmtHD(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d.replace(/-/g, '/') : (d ? '日期補查中' : '--'); }

    function openStockDetail(id) {
      const s = stockMap.get(id);
      if (!s) return;
      detailStockId = id;
      const hi = highMap[id];
      const col = colOf(s.change);
      const pctTxt = (s.change > 0 && !s.pctStr.startsWith('+')) ? '+' + s.pctStr : s.pctStr;
      const tile = (label, val, sub) => `
        <div class="bg-slate-100 dark:bg-slate-950 p-2.5 rounded-2xl min-w-0">
          <span class="text-[10px] text-slate-500 dark:text-slate-400 block mb-0.5">${label}</span>
          <span class="text-sm sm:text-base font-black font-mono block truncate">${val}</span>
          ${sub ? `<span class="text-[9px] text-slate-400 font-mono block truncate">${sub}</span>` : ''}
        </div>`;
      const wtile = (label, val, sub) => `
        <div class="bg-white dark:bg-slate-900 rounded-xl p-2 border border-slate-200 dark:border-slate-800 min-w-0">
          <span class="text-[10px] text-slate-500 dark:text-slate-400 block">${label}</span>
          <span class="text-sm font-black font-mono block truncate">${val}</span>
          ${sub ? `<span class="text-[9px] text-slate-400 font-mono block truncate">${sub}</span>` : ''}
        </div>`;

      // 高點追蹤
      let highHtml = '';
      if (hi) {
        const cur = s.price || hi.close;
        const gap = cur && hi.prevHigh ? (cur / hi.prevHigh - 1) * 100 : hi.gap;
        const diff = cur && hi.prevHigh ? cur - hi.prevHigh : null;
        const breakPct = hi.broke && cur && hi.oldHigh ? (cur / hi.oldHigh - 1) * 100 : null;
        highHtml = `
          <div class="space-y-2">
            <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">新高狀態</span><div class="flex items-center gap-1.5">${highSynced(s, hi) ? (highBadgeHtml(hi) || '<span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-200/70 dark:bg-slate-800 text-slate-500">未突破</span>') : `<span class="px-1.5 py-0.5 rounded text-[10px] bg-amber-500/10 text-amber-600 dark:text-amber-400" title="高點追蹤與報價日期不同，暫不判斷">高點資料 ${escHtml(pfShort(pfNormDate(hi.date)))}・未同步</span>`}${highSynced(s, hi) && hi.streak >= 2 ? `<span class="text-[10px] text-amber-600 dark:text-amber-400 font-bold">連續 ${hi.streak} 日</span>` : ''}</div></div>
            <div class="grid grid-cols-3 gap-2">
              ${wtile('追蹤區間前高', fmtNum(hi.prevHigh), fmtHD(hi.prevDate) + (hi.broke ? ' <span class="text-amber-500">今日創高</span>' : ''))}
              ${wtile('距前高', `<span class="${colOf(gap)}">${gap > 0 ? '+' : ''}${isNaN(gap) ? '--' : gap.toFixed(2) + '%'}</span>`, diff !== null ? `${diff > 0 ? '+' : ''}${diff.toFixed(2)} 元` : '')}
              ${hi.broke
                ? wtile('突破原前高', `<span class="${colOf(breakPct)}">${breakPct > 0 ? '+' : ''}${(breakPct ?? 0).toFixed(2)}%</span>`, `原前高 ${fmtNum(hi.oldHigh)}・${fmtHD(hi.oldDate)}`)
                : wtile('當日最高', hi.dayHigh ? fmtNum(hi.dayHigh) : '--', hi.date ? '資料日 ' + fmtHD(hi.date) : '')}
            </div>
          </div>`;
      }
      // 近十日高低（收盤價回推）
      const pts = s.prices.map((p, i) => (s.tenDayHistory[i].hasData && p) ? { p, date: s.tenDayHistory[i].date } : null).filter(Boolean);
      let tenHtml = '';
      if (pts.length >= 2) {
        let hiP = pts[0], loP = pts[0];
        pts.forEach(x => { if (x.p >= hiP.p) hiP = x; if (x.p <= loP.p) loP = x; });
        const g = (s.price / hiP.p - 1) * 100;
        const pos = hiP.p > loP.p ? ((s.price - loP.p) / (hiP.p - loP.p)) * 100 : 100;
        tenHtml = `
          <div class="space-y-2">
            <span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">近十日高低（收盤價）</span>
            <div class="grid grid-cols-3 gap-2">
              ${wtile('十日最高', fmtNum(hiP.p), escHtml(hiP.date || ''))}
              ${wtile('距十日高', `<span class="${colOf(g)}">${g > 0 ? '+' : ''}${g.toFixed(2)}%</span>`, `${(s.price - hiP.p) > 0 ? '+' : ''}${(s.price - hiP.p).toFixed(2)} 元`)}
              ${wtile('十日最低', fmtNum(loP.p), escHtml(loP.date || ''))}
            </div>
            <div class="relative h-2 rounded-full bg-gradient-to-r from-emerald-500/30 via-slate-300/40 dark:via-slate-700/60 to-red-500/30">
              <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-brand-500 border-2 border-white dark:border-slate-900 shadow" style="left:calc(${Math.min(Math.max(pos, 0), 100)}% - 6px)"></div>
            </div>
            <div class="text-[9px] text-slate-400 text-center">目前位於十日區間 ${Math.round(pos)}%</div>
          </div>`;
      }

      // 十日價格線圖 + 成交量柱
      const W = 440, H = 120, pad = 22;
      let priceSvg = '<div class="text-xs text-slate-400 py-6 text-center">暫無十日走勢</div>';
      if (pts.length >= 2) {
        const min = Math.min(...pts.map(x => x.p)), max = Math.max(...pts.map(x => x.p));
        const rng = (max - min) || max * 0.02 || 1;
        const xs = i => pad + (i / (pts.length - 1)) * (W - pad * 2);
        const ys = p => H - pad - ((p - min) / rng) * (H - pad * 2);
        const color = s.cumPct >= 0 ? '#ef4444' : '#22c55e';
        priceSvg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-28 overflow-visible">
          <polyline points="${pts.map((x, i) => `${xs(i)},${ys(x.p)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
          ${pts.map((x, i) => `<circle cx="${xs(i)}" cy="${ys(x.p)}" r="3" fill="${color}"/><text x="${xs(i)}" y="${ys(x.p) - 6}" text-anchor="middle" font-size="8" font-family="monospace" fill="#94a3b8">${x.p >= 100 ? Math.round(x.p) : x.p.toFixed(1)}</text>`).join('')}
        </svg>
        <div class="flex justify-between text-[9px] text-slate-400 font-mono px-1"><span>${escHtml(pts[0].date || '')}</span><span class="text-brand-500 font-bold">${escHtml(pts[pts.length - 1].date || '')}</span></div>`;
      }
      const vols = s.tenDayVol.filter(v => v.hasData);
      let volSvg = '';
      if (vols.length) {
        const vmax = Math.max(...vols.map(v => v.numVal), 1);
        const bw = (W - pad * 2) / vols.length;
        volSvg = `<svg viewBox="0 0 ${W} 70" class="w-full h-16">
          ${vols.map((v, i) => { const h = (v.numVal / vmax) * 52; return `<rect x="${pad + i * bw + 2}" y="${62 - h}" width="${bw - 4}" height="${Math.max(h, 1)}" rx="2" fill="#f59e0b" opacity="${i === vols.length - 1 ? 1 : 0.55}"><title>${escHtml(v.date || '')}：${Math.round(v.numVal).toLocaleString()} 張</title></rect>`; }).join('')}

    async function journalPost(body, timeoutMs) {
      const ctl = new AbortController();
      const limit = timeoutMs || 30000;
      const timer = setTimeout(() => ctl.abort(), limit);
      try {
        const res = await fetch(BACKEND_API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (pe) {
          // 後端回的不是 JSON（Google 錯誤頁 / 授權頁）→ 抽出可讀的錯誤文字
          const plain = text.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          throw new Error('HTTP ' + res.status + '：' + (plain.slice(0, 160) || '非 JSON 回應'));
        }
      } catch (e) {
        if (e && e.name === 'AbortError') throw new Error('後端超過 ' + Math.round(limit / 1000) + ' 秒沒有回應');
        throw e;
      } finally { clearTimeout(timer); }
    }

      const kpi = cur ? [
        tile('總淨值', jnFmt(cur[k.v]), `<span class="text-slate-400">資料日 ${lastDate.slice(5).replace('-', '/')}</span>`),
        tile('今日損益', `<span class="${jnCol(cur[k.day])}">${jnSigned(cur[k.day])}</span>`, cur[k.v] ? `<span class="${jnCol(cur[k.day])}">${jnPct(cur[k.day] / (cur[k.v] - cur[k.day]) * 100)}</span>` : ''),
        tile('庫存成本', jnFmt(cur[k.cost]), ''),
        tile('庫存損益', `<span class="${jnCol(cur[k.pl])}">${jnSigned(cur[k.pl])}</span>`, `<span class="${jnCol(cur[k.roi])}">報酬率 ${jnPct(cur[k.roi])}</span>`),
        tile('含息報酬', `<span class="${jnCol(cur[k.plDiv])}">${jnSigned(cur[k.plDiv])}</span>`, `<span class="${jnCol(cur[k.roiDiv])}">含息報酬率 ${jnPct(cur[k.roiDiv])}</span>`),
        tile('累計股息', jnFmt(cur[k.div]), '')
      ].join('') : '<div class="col-span-full text-xs text-slate-400">紀錄中心沒有資料</div>';

      const holdings = (J.holdings || []);
      const active = holdings.filter(h => h.shares > 0);
      const closed = holdings.filter(h => !(h.shares > 0) && ((h.totalPl && h.totalPl !== 0) || (h.realized && h.realized !== 0)));

      box.innerHTML = `
        ${jnCard(`
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-lg sm:text-xl font-black text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-book-open text-brand-500"></i>我的投資日誌</h2>
              <p class="text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">來源：你的日誌試算表（${escHtml(J.updated || '')} 讀取）・僅本人可見</p>
            </div>
            <div class="flex items-center gap-2">
              ${seg('scope', scope, [['total', '總體'], ['stock', '個股'], ['etf', 'ETF']], 'setJournalScope')}
              <button onclick="loadJournal(true)" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-500 text-xs" title="重新讀取"><i class="fa-solid fa-rotate-right ${journalState.loading ? 'fa-spin' : ''}"></i></button>
            </div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">${kpi}</div>
        `)}

        ${jnCard(`
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-brand-500"></i>圖表中心</h2>
            ${seg('range', journalState.range, [[20, '20日'], [60, '60日'], [120, '120日'], [0, '全期']], 'setJournalRange')}
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4">
            ${chartBox('jc_nav', '資產淨值與成本')}
            ${chartBox('jc_roi', '累計報酬率（含息 vs 不含息）')}
            ${chartBox('jc_bench', '策略績效 vs 加權指數', '以每日損益 ÷ 前日淨值串接的時間加權報酬，區間起點歸零')}
            ${chartBox('jc_daily', '每日損益變動')}
            ${chartBox('jc_split', '個股 vs ETF 含息報酬率')}
            ${chartBox('jc_cost', '個股 vs ETF 成本趨勢')}
            ${chartBox('jc_alloc', '持股現值配置', '', true)}
            ${chartBox('jc_contrib', '損益貢獻（含息總損益）', '', true)}
          </div>
        `)}

        ${jnCard(`
          <div class="flex items-center justify-between gap-2 mb-3">
            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-briefcase text-brand-500"></i>目前持股 <span class="text-xs font-normal text-slate-400">${active.length} 檔</span></h2>
            <span class="text-[10px] text-slate-400">點擊列可展開該檔交易紀錄</span>
          </div>
          ${holdingsTable(active, cur ? cur.tv : null)}
          ${closed.length ? `
          <details class="mt-3 group">
            <summary class="cursor-pointer text-xs font-bold text-slate-500 dark:text-slate-400 select-none">已出清 / 無庫存（${closed.length} 檔）</summary>
            <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
              ${closed.map(h => `<div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-[11px]">
                <span class="min-w-0 truncate"><b class="text-slate-800 dark:text-slate-100">${escHtml(h.name)}</b> <span class="text-slate-400 font-mono">${escHtml(h.code)}</span></span>
                <span class="font-mono font-bold shrink-0 ${jnCol(h.totalPl ?? h.realized)}">已實現 ${jnSigned(h.realized ?? h.totalPl)}</span></div>`).join('')}
            </div>
          </details>` : ''}
        `)}

        ${jnCard(`
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-receipt text-brand-500"></i>交易紀錄 <span class="text-xs font-normal text-slate-400">${(J.trades || []).length} 筆</span></h2>
            <div class="flex items-center gap-2">
              <input type="text" value="${escHtml(journalState.tradeQuery)}" oninput="journalState.tradeQuery=this.value; journalState.tradeLimit=30; renderTradeList()" placeholder="搜尋股名/代號/原因" class="w-36 sm:w-48 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-[11px]">
              ${seg('tf', journalState.tradeFilter, [['all', '全部'], ['買入', '買入'], ['賣出', '賣出']], 'setTradeFilter')}
            </div>
          </div>
          <div id="tradeListBox"></div>
        `)}

        <div class="flex items-center justify-between text-[10px] text-slate-400 px-1">
          <span><i class="fa-solid fa-lock mr-1"></i>資料由後端驗證身分後讀取，不會存到瀏覽器或公開發布。</span>
          <button onclick="unlinkJournal()" class="hover:text-rose-500">解除日誌連結</button>
        </div>`;

      renderTradeList();
      requestAnimationFrame(() => renderJournalCharts(J));
    }

    function chartBox(id, title, note = '', html = false) {
      return `<div class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 min-w-0">
        <div class="flex items-center justify-between gap-2 mb-1"><h3 class="text-[11px] sm:text-xs font-bold text-slate-700 dark:text-slate-200">${title}</h3><div id="${id}_legend" class="flex flex-wrap justify-end gap-x-2 text-[10px]"></div></div>
        ${note ? `<p class="text-[9px] text-slate-400 mb-1">${note}</p>` : ''}
        <div id="${id}" class="relative w-full ${html ? '' : 'h-[190px] sm:h-[210px]'}"></div>
      </div>`;
    }

    function setJournalScope(v) { journalState.scope = v; renderJournal(); }
    function setJournalRange(v) { journalState.range = Number(v); renderJournal(); }
    function setTradeFilter(v) { journalState.tradeFilter = v; journalState.tradeLimit = 30; renderJournal(); }
    function toggleHoldingTrades(code) { journalState.openHolding = journalState.openHolding === code ? null : code; renderJournal(); }

    function holdingsTable(active, totalValue) {
      if (!active.length) return '<div class="py-6 text-center text-xs text-slate-400">目前沒有持股</div>';
      const tv = totalValue || active.reduce((a, h) => a + (h.value || h.price * h.shares || 0), 0);
      const rows = [...active].sort((a, b) => (b.value || 0) - (a.value || 0)).map(h => {
        const val = h.value || (h.price * h.shares);
        const w = tv ? val / tv * 100 : 0;
        const open = journalState.openHolding === h.code;
        const trades = open ? (journalState.data.trades || []).filter(t => t.code === h.code) : [];
        return `
          <tr onclick="toggleHoldingTrades('${escHtml(h.code)}')" class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-900/60 transition ${open ? 'bg-slate-50 dark:bg-slate-900/60' : ''}">
            <td class="py-2 px-2 sm:px-3"><div class="font-bold text-slate-900 dark:text-slate-100 text-xs sm:text-sm">${escHtml(h.name)}</div><div class="text-[10px] text-slate-400 font-mono">${escHtml(h.code)} · <span class="${h.type === 'etf' ? 'text-teal-600 dark:text-teal-400' : 'text-amber-600 dark:text-amber-400'}">${h.type === 'etf' ? 'ETF' : '個股'}</span></div></td>
            <td class="py-2 px-2 text-right font-mono text-xs">${jnFmt(h.shares)}</td>
            <td class="py-2 px-2 text-right font-mono text-xs hidden sm:table-cell">${jnFmt(h.avg, 2)}</td>
            <td class="py-2 px-2 text-right font-mono text-xs"><div class="font-bold ${jnCol(h.dayChg)}">${jnFmt(h.price, 2)}</div><div class="text-[10px] ${jnCol(h.dayPct)}">${jnPct(h.dayPct)}</div></td>
            <td class="py-2 px-2 text-right font-mono text-xs"><div class="font-bold ${jnCol(h.unrealized)}">${jnSigned(h.unrealized)}</div><div class="text-[10px] ${jnCol(h.plPct)}">${jnPct(h.plPct)}</div></td>
            <td class="py-2 px-2 text-right font-mono text-xs hidden md:table-cell ${jnCol(h.dayPl)}">${jnSigned(h.dayPl)}</td>
            <td class="py-2 px-2 sm:px-3 text-right hidden sm:table-cell"><div class="text-[11px] font-mono">${w.toFixed(1)}%</div><div class="h-1 mt-1 w-16 ml-auto rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"><div class="h-full bg-brand-500" style="width:${Math.min(w, 100)}%"></div></div></td>
          </tr>
          ${open ? `<tr><td colspan="7" class="px-2 sm:px-3 pb-3 bg-slate-50 dark:bg-slate-900/60">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] font-mono mb-2 mt-1">
              <div>總買入 <b>${jnFmt(h.totalBuy)}</b></div><div>總賣出 <b>${jnFmt(h.totalSell)}</b></div>
              <div>配息 <b>${jnFmt(h.dividend)}</b></div><div>含息總損益 <b class="${jnCol(h.totalPlDiv)}">${jnSigned(h.totalPlDiv)}</b></div>
            </div>
            ${tradeRowsHtml(trades, true)}</td></tr>` : ''}`;
      }).join('');
      return `<div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-100 dark:bg-slate-950 text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400"><tr>
            <th class="py-2 px-2 sm:px-3">標的</th><th class="py-2 px-2 text-right">股數</th><th class="py-2 px-2 text-right hidden sm:table-cell">均價</th>
            <th class="py-2 px-2 text-right">現價</th><th class="py-2 px-2 text-right">未實現損益</th><th class="py-2 px-2 text-right hidden md:table-cell">今日損益</th><th class="py-2 px-2 sm:px-3 text-right hidden sm:table-cell">權重</th>
          </tr></thead>
          <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60">${rows}</tbody>
        </table></div>`;
    }

    function tradeRowsHtml(trades, compact) {
      if (!trades.length) return '<div class="py-4 text-center text-[11px] text-slate-400">沒有符合的交易紀錄</div>';
      return `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 ${compact ? '' : 'rounded-xl border border-slate-200 dark:border-slate-800'}">
        ${trades.map(t => {
          const buy = t.side.indexOf('買') >= 0;
          return `<div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 px-2 py-1.5 text-[11px]">
            <span class="font-mono text-slate-400 w-20 shrink-0">${escHtml(t.date)}</span>
            <span class="px-1.5 rounded text-[10px] font-bold ${buy ? 'bg-red-500/10 text-stockRed' : 'bg-green-500/10 text-stockGreen'}">${escHtml(t.side || '-')}</span>
            ${compact ? '' : `<span class="font-bold text-slate-800 dark:text-slate-100">${escHtml(t.name)}</span><span class="text-[10px] text-slate-400 font-mono">${escHtml(t.code)}</span>`}
            <span class="font-mono">${jnFmt(t.shares)} 股 @ ${jnFmt(t.price, 2)}</span>
            <span class="font-mono text-slate-400 hidden sm:inline">≈ ${jnFmt((t.shares || 0) * (t.price || 0))} 元${t.fee ? `・費 ${jnFmt(t.fee)}` : ''}</span>
            ${t.reason && t.reason !== '尚未填寫' ? `<span class="px-1.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escHtml(t.reason)}</span>` : (t.reason ? '<span class="text-slate-400">原因未填</span>' : '')}
            ${t.note && t.note !== '-合併計入-' ? `<span class="text-slate-500 dark:text-slate-400 truncate">${escHtml(t.note)}</span>` : ''}
          </div>`;
        }).join('')}</div>`;
    }

    function renderTradeList() {
      const box = document.getElementById('tradeListBox');
      if (!box || !journalState.data) return;
      const q = journalState.tradeQuery.trim().toLowerCase();
      let list = (journalState.data.trades || []);
      if (journalState.tradeFilter !== 'all') list = list.filter(t => t.side.indexOf(journalState.tradeFilter) >= 0);
      if (q) list = list.filter(t => (t.name + t.code + t.reason + t.note).toLowerCase().includes(q));
      const shown = list.slice(0, journalState.tradeLimit);
      box.innerHTML = tradeRowsHtml(shown, false) + (list.length > shown.length
        ? `<button onclick="journalState.tradeLimit += 50; renderTradeList()" class="w-full mt-2 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 hover:text-brand-500">顯示更多（還有 ${list.length - shown.length} 筆）</button>` : '');
    }

    // ---------- 圖表 ----------
    function renderJournalCharts(J) {
      const all = (J.history || []).filter(h => h.tv !== null);
      const n = journalState.range;
      const H = n ? all.slice(-n) : all;
      if (!H.length) return;
      const dates = H.map(h => h.date);

      lineChart('jc_nav', dates, [
        { name: '總淨值', values: H.map(h => h.tv), color: JN_COLORS.a, area: true },
        { name: '庫存成本', values: H.map(h => h.tCost), color: JN_COLORS.muted, dash: true }
      ], v => jnFmt(v));
      lineChart('jc_roi', dates, [
        { name: '含息', values: H.map(h => h.tRoiDiv), color: JN_COLORS.a },
        { name: '不含息', values: H.map(h => h.tRoi), color: JN_COLORS.b, dash: true }
      ], v => v.toFixed(1) + '%', true);

      // 時間加權報酬 vs 加權指數（區間起點歸零）
      let strat = 1; const sArr = [0];
      for (let i = 1; i < H.length; i++) {
        const prev = H[i - 1].tv, d = H[i].tDay;
        if (prev && d !== null) strat *= 1 + d / prev;
        sArr.push((strat - 1) * 100);
      }
      const idx0 = H.find(h => h.idx)?.idx;
      lineChart('jc_bench', dates, [
        { name: '我的策略', values: sArr, color: JN_COLORS.a },
        { name: '加權指數', values: H.map(h => (h.idx && idx0) ? (h.idx / idx0 - 1) * 100 : null), color: JN_COLORS.muted, dash: true }
      ], v => v.toFixed(1) + '%', true);

      barChart('jc_daily', dates, H.map(h => h.tDay), v => jnSigned(v));
      lineChart('jc_split', dates, [
        { name: '個股', values: H.map(h => h.sRoiDiv), color: JN_COLORS.b },
        { name: 'ETF', values: H.map(h => h.eRoiDiv), color: JN_COLORS.d }
      ], v => v.toFixed(1) + '%', true);
      lineChart('jc_cost', dates, [
        { name: '個股成本', values: H.map(h => h.sCost), color: JN_COLORS.b },
        { name: 'ETF成本', values: H.map(h => h.eCost), color: JN_COLORS.d }
      ], v => jnFmt(v));

      const active = (J.holdings || []).filter(h => h.shares > 0).map(h => ({ ...h, val: h.value || h.price * h.shares || 0 })).sort((a, b) => b.val - a.val);
      donutChart('jc_alloc', active);
      contribChart('jc_contrib', (J.holdings || []).filter(h => h.totalPlDiv !== null && h.totalPlDiv !== 0));
    }

    function chartLegend(id, series) {
      const el = document.getElementById(id + '_legend');
      if (el) el.innerHTML = series.map(s => `<span class="inline-flex items-center gap-1 text-slate-500 dark:text-slate-400"><span class="inline-block w-3 ${s.dash ? 'border-t-2 border-dashed' : 'h-0.5 rounded'}" style="${s.dash ? 'border-color:' + s.color : 'background:' + s.color}"></span>${s.name}</span>`).join('');
    }

    function niceTicks(min, max, count = 4) {
      if (min === max) { min -= 1; max += 1; }
      const rough = (max - min) / count;
      const mag = Math.pow(10, Math.floor(Math.log10(rough)));
      const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= rough) || rough;
      const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
      const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
      return { lo, hi, ticks };
    }

    function axisLabel(v, pctMode) {
      if (pctMode) return v.toFixed(Math.abs(v) < 10 ? 1 : 0) + '%';
      const a = Math.abs(v);
      return a >= 1e4 ? (v / 1e4).toFixed(a >= 1e5 ? 0 : 1) + '萬' : Math.round(v).toLocaleString('en-US');
    }

    function lineChart(id, dates, series, fmt, pctMode) {
      const el = document.getElementById(id);
      if (!el) return;
      chartLegend(id, series);
      const W = Math.max(el.clientWidth, 240), Hh = Math.max(el.clientHeight, 160);
      const padL = 44, padR = 6, padT = 8, padB = 18;
      const vals = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined && !isNaN(v));
      if (!vals.length) { el.innerHTML = '<div class="h-full flex items-center justify-center text-[11px] text-slate-400">暫無資料</div>'; return; }
      const { lo, hi, ticks } = niceTicks(Math.min(...vals, pctMode ? 0 : Infinity), Math.max(...vals));
      const n = dates.length;
      const x = i => padL + (n <= 1 ? 0 : i / (n - 1)) * (W - padL - padR);
      const y = v => padT + (1 - (v - lo) / (hi - lo || 1)) * (Hh - padT - padB);
      let g = ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" stroke-opacity="${t === 0 && pctMode ? 0.35 : 0.1}"/><text x="${padL - 5}" y="${y(t) + 3}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${axisLabel(t, pctMode)}</text>`).join('');
      series.forEach(s => {
        const pts = s.values.map((v, i) => (v === null || v === undefined || isNaN(v)) ? null : [x(i), y(v)]).filter(Boolean);
        if (pts.length < 2) return;
        if (s.area) g += `<polygon points="${pts.map(p => p.join(',')).join(' ')} ${pts[pts.length - 1][0]},${Hh - padB} ${pts[0][0]},${Hh - padB}" fill="${s.color}" fill-opacity="0.1"/>`;
        g += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 3"' : ''}/>`;
      });
      const li = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
      g += li.map((i, k) => `<text x="${x(i)}" y="${Hh - 4}" text-anchor="${k === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${dates[i].slice(5).replace('-', '/')}</text>`).join('');
      g += `<line class="jc-cross" x1="0" x2="0" y1="${padT}" y2="${Hh - padB}" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="2 2" visibility="hidden"/>`;
      g += `<rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${Hh - padT - padB}" fill="transparent"/>`;
      el.innerHTML = `<svg width="${W}" height="${Hh}" class="block text-slate-500 dark:text-slate-400">${g}</svg><div class="jc-tip hidden absolute top-1 z-10 pointer-events-none bg-slate-900/95 text-slate-100 text-[10px] font-mono rounded-lg px-2 py-1.5 shadow-xl border border-slate-700 whitespace-nowrap"></div>`;
      attachHover(el, n, x, i => `<div class="font-bold text-slate-300 mb-0.5">${dates[i]}</div>` + series.map(s => `<div><span style="color:${s.color}">●</span> ${s.name} <b>${s.values[i] === null || s.values[i] === undefined ? '--' : fmt(s.values[i])}</b></div>`).join(''), padL, W - padR);
    }

    function barChart(id, dates, values, fmt) {
      const el = document.getElementById(id);
      if (!el) return;
      const leg = document.getElementById(id + '_legend');
      if (leg) leg.innerHTML = '<span class="text-stockRed">■ 獲利</span><span class="text-stockGreen">■ 虧損</span>';
      const W = Math.max(el.clientWidth, 240), Hh = Math.max(el.clientHeight, 160);
      const padL = 44, padR = 6, padT = 8, padB = 18;
      const vals = values.filter(v => v !== null && !isNaN(v));
      if (!vals.length) { el.innerHTML = '<div class="h-full flex items-center justify-center text-[11px] text-slate-400">暫無資料</div>'; return; }
      const { lo, hi, ticks } = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
      const n = dates.length, slot = (W - padL - padR) / n, bw = Math.max(slot - (slot > 5 ? 2 : 0.5), 1);
      const x = i => padL + i * slot + slot / 2;
      const y = v => padT + (1 - (v - lo) / (hi - lo || 1)) * (Hh - padT - padB);
      let g = ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" stroke-opacity="${t === 0 ? 0.35 : 0.1}"/><text x="${padL - 5}" y="${y(t) + 3}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${axisLabel(t)}</text>`).join('');
      values.forEach((v, i) => {
        if (v === null || isNaN(v)) return;
        const y0 = y(0), y1 = y(v);
        g += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(Math.abs(y1 - y0), 0.5).toFixed(1)}" fill="${v >= 0 ? '#ef4444' : '#22c55e'}" fill-opacity="0.8" rx="${bw > 4 ? 1.5 : 0}"/>`;
      });
      const li = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
      g += li.map((i, k) => `<text x="${x(i)}" y="${Hh - 4}" text-anchor="${k === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${dates[i].slice(5).replace('-', '/')}</text>`).join('');
      g += `<line class="jc-cross" x1="0" x2="0" y1="${padT}" y2="${Hh - padB}" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="2 2" visibility="hidden"/>`;
      el.innerHTML = `<svg width="${W}" height="${Hh}" class="block text-slate-500 dark:text-slate-400">${g}</svg><div class="jc-tip hidden absolute top-1 z-10 pointer-events-none bg-slate-900/95 text-slate-100 text-[10px] font-mono rounded-lg px-2 py-1.5 shadow-xl border border-slate-700 whitespace-nowrap"></div>`;
      attachHover(el, n, x, i => `<div class="font-bold text-slate-300 mb-0.5">${dates[i]}</div><div>當日損益 <b class="${values[i] >= 0 ? 'text-red-400' : 'text-green-400'}">${fmt(values[i])}</b></div>`, padL, W - padR);
    }

    function attachHover(el, n, xFn, html, x0, x1) {
      const svg = el.querySelector('svg'), tip = el.querySelector('.jc-tip'), cross = el.querySelector('.jc-cross');
      const move = ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        if (px < x0 - 4 || px > x1 + 4) return;
        let best = 0, bd = Infinity;
        for (let i = 0; i < n; i++) { const d = Math.abs(xFn(i) - px); if (d < bd) { bd = d; best = i; } }
        const cx = xFn(best);
        cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
        tip.innerHTML = html(best); tip.classList.remove('hidden');
        const tw = tip.offsetWidth; let left = cx + 10; if (left + tw > r.width) left = cx - tw - 10;
        tip.style.left = Math.max(0, left) + 'px';
      };
      svg.addEventListener('mousemove', move);
      svg.addEventListener('touchstart', move, { passive: true });
      svg.addEventListener('touchmove', move, { passive: true });
      svg.addEventListener('mouseleave', () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); });
    }

    function donutChart(id, items) {
      const el = document.getElementById(id);
      if (!el) return;
      const total = items.reduce((a, h) => a + h.val, 0);
      if (!total) { el.innerHTML = '<div class="py-8 text-center text-[11px] text-slate-400">暫無持股</div>'; return; }
      const top = items.slice(0, 8);
      const rest = items.slice(8).reduce((a, h) => a + h.val, 0);
      const parts = top.map((h, i) => ({ name: h.name, code: h.code, val: h.val, color: DONUT_COLORS[i], type: h.type }));
      if (rest > 0) parts.push({ name: '其他', code: '', val: rest, color: DONUT_COLORS[8] });
      const etfV = items.filter(h => h.type === 'etf').reduce((a, h) => a + h.val, 0);
      const R = 62, r = 40, C = 74;
      let ang = -Math.PI / 2, arcs = '';
      parts.forEach(p => {
        const a = p.val / total * Math.PI * 2, a2 = ang + a, large = a > Math.PI ? 1 : 0;
        const pt = (rad, rr) => `${(C + rr * Math.cos(rad)).toFixed(2)},${(C + rr * Math.sin(rad)).toFixed(2)}`;
        arcs += a >= Math.PI * 2 - 1e-6
          ? `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${p.color}" stroke-width="${R - r}"/>`
          : `<path d="M${pt(ang, R)} A${R},${R} 0 ${large} 1 ${pt(a2, R)} L${pt(a2, r)} A${r},${r} 0 ${large} 0 ${pt(ang, r)} Z" fill="${p.color}" stroke="currentColor" stroke-width="1.5" class="text-white dark:text-slate-950"><title>${escHtml(p.name)} ${(p.val / total * 100).toFixed(1)}%</title></path>`;
        ang = a2;
      });
      el.innerHTML = `<div class="flex flex-col sm:flex-row items-center gap-3">
        <svg width="148" height="148" viewBox="0 0 148 148" class="shrink-0">${arcs}
          <text x="${C}" y="${C - 4}" text-anchor="middle" font-size="9" class="fill-slate-500 dark:fill-slate-400">總現值</text>
          <text x="${C}" y="${C + 10}" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,monospace" class="fill-slate-900 dark:fill-slate-100">${axisLabel(total)}</text></svg>
        <div class="flex-1 w-full space-y-1">
          <div class="flex items-center gap-2 text-[10px] text-slate-500 dark:text-slate-400 mb-1">
            <span>個股 ${(100 - etfV / total * 100).toFixed(1)}%</span>
            <div class="flex-1 h-1.5 rounded-full overflow-hidden flex bg-slate-200 dark:bg-slate-800"><div class="bg-amber-500" style="width:${100 - etfV / total * 100}%"></div><div class="bg-teal-600" style="width:${etfV / total * 100}%"></div></div>
            <span>ETF ${(etfV / total * 100).toFixed(1)}%</span>
          </div>
          ${parts.map(p => `<div class="flex items-center justify-between gap-2 text-[11px]"><span class="flex items-center gap-1.5 min-w-0"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${p.color}"></span><span class="truncate text-slate-700 dark:text-slate-200">${escHtml(p.name)}</span></span><span class="font-mono text-slate-500 dark:text-slate-400 shrink-0">${(p.val / total * 100).toFixed(1)}%</span></div>`).join('')}
        </div></div>`;
      const leg = document.getElementById(id + '_legend'); if (leg) leg.innerHTML = '';
    }

    // =====================================================================
    // 📒 手動投資日誌（預設；有自己的試算表可改用連結）
    // =====================================================================
    function pzFee(amount) { return Math.max(20, Math.round(amount * 0.001425)); }
    function pzTax(code, amount) { return Math.round(amount * (/^00/.test(code) ? 0.001 : 0.003)); }
    function pzPortfolio() {
      const pos = {}; let realized = 0;
      pzState.trades.slice().sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0)).forEach(t => {
        const p = pos[t.code] = pos[t.code] || { code: t.code, name: t.name || pzName(t.code), shares: 0, cost: 0, realized: 0, buys: 0 };
        if (t.side === '賣出') {
          const q = Math.min(t.shares, p.shares), avg = p.shares > 0 ? p.cost / p.shares : 0;
          const r = t.price * q - t.fee - t.tax - avg * q;
          p.realized += r; realized += r; p.cost -= avg * q; p.shares -= q;
        } else { p.shares += t.shares; p.cost += t.shares * t.price + t.fee; p.buys++; }
      });
      const holdings = Object.values(pos).map(p => {
        const s = stockMap.get(p.code);
        const px = s ? s.price : null;
        const value = px !== null && p.shares > 0 ? px * p.shares : null;
        return { ...p, name: p.name || (s && s.name) || p.code, price: px, value, unreal: value !== null ? value - p.cost : null, avg: p.shares > 0 ? p.cost / p.shares : 0, listed: !!s, dayPct: s ? s.pctNum : null };
      });
      return { holdings, realized };
    }

      const open = holdings.filter(h => h.shares > 0).sort((a, b) => (b.value ?? b.cost) - (a.value ?? a.cost));

        ${showForm ? `<div class="rounded-2xl border border-brand-500/30 bg-brand-500/5 p-3 space-y-2">
