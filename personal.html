            <input id="pzJ_date" type="date" value="${escHtml(f.date || pfToday())}" class="${pzInput}">
            ${pzCodeInput('pzJ_code', f.code, "pzTradeCalc(true)")}
            <span id="pzJ_name" class="text-slate-500 min-w-[3rem]">${escHtml(f.code ? pzName(f.code) : '')}</span>
            <select id="pzJ_side" onchange="pzTradeCalc(true)" class="${pzInput}"><option ${f.side !== '賣出' ? 'selected' : ''}>買進</option><option ${f.side === '賣出' ? 'selected' : ''}>賣出</option></select>
            <input id="pzJ_shares" type="number" min="1" step="1" value="${f.shares || ''}" oninput="pzTradeCalc(true)" placeholder="股數（1張=1000）" class="${pzInput} w-32 font-mono">
            <input id="pzJ_price" type="number" min="0" step="0.01" value="${f.price || ''}" oninput="pzTradeCalc(true)" placeholder="成交價" class="${pzInput} w-24 font-mono">
            <span class="text-slate-500">手續費</span><input id="pzJ_fee" type="number" min="0" step="1" value="${f.fee ?? ''}" oninput="this.dataset.manual=1" class="${pzInput} w-20 font-mono">
            <span class="text-slate-500">交易稅</span><input id="pzJ_tax" type="number" min="0" step="1" value="${f.tax ?? ''}" oninput="this.dataset.manual=1" class="${pzInput} w-20 font-mono">
          </div>
          <div class="flex flex-wrap items-center gap-2 text-xs">
            <input id="pzJ_reason" value="${escHtml(f.reason || '')}" placeholder="買賣理由（例：逢低布局、停損、達目標價）" class="${pzInput} flex-1 min-w-[12rem]">
            <input id="pzJ_note" value="${escHtml(f.note || '')}" placeholder="備註（選填）" class="${pzInput} flex-1 min-w-[8rem]">
            <span id="pzJ_amt" class="text-slate-500 font-mono"></span>
            <button onclick="pzSaveTrade()" class="${pzBtn}">${f.id ? '儲存修改' : '新增'}</button>
            <button onclick="journalState.manualForm=false; pzEditTrade=null; renderManualJournal()" class="${pzBtnGhost}">收起</button>
          </div>
          <div id="pzJ_unlisted">${f.code ? pzUnlistedHtml(f.code, 'pzJ_req') : ''}</div>
          <p class="text-[10px] text-slate-400">手續費預設 0.1425%（最低 20 元）、證交稅 0.3%（ETF 0.1%）；有券商折扣可直接改數字。</p>
        </div>` : ''}
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          ${tile('持股市值', jnFmt(value), `${open.length} 檔持股${unlisted.length ? '・' + unlisted.length + ' 檔以成本計' : ''}`)}
          ${tile('持股成本', jnFmt(cost))}
          ${tile('未實現損益', jnSigned(unreal), cost ? jnPct(unreal / cost * 100) : '', jnCol(unreal))}
          ${tile('已實現損益', jnSigned(realized), `${pzState.trades.length} 筆交易`, jnCol(realized))}
        </div>
        ${unlisted.length ? `<div class="text-[11px] text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 rounded-xl px-3 py-2"><i class="fa-solid fa-circle-info mr-1"></i>${unlisted.map(h => escHtml(h.code)).join('、')} 不在收錄清單，市值暫以成本計算。可在記帳表單輸入該代號後寄信申請收錄。</div>` : ''}
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          ${chartBox('pz_nav', '資產淨值與成本', pzState.nav.length < 2 ? '每日收盤後自動記錄，累積兩天以上顯示走勢' : '')}
          ${chartBox('pz_alloc', '持股配置', '', true)}
        </div>
        ${open.length ? `<div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-[10px] text-slate-500 border-b border-slate-200 dark:border-slate-800"><tr><th class="py-2 text-left">標的</th><th class="text-right">股數</th><th class="text-right">均價</th><th class="text-right">現價</th><th class="text-right">未實現</th><th class="text-right">已實現</th></tr></thead><tbody>
          ${open.map(h => `<tr class="border-b border-slate-100 dark:border-slate-800/60 ${h.listed ? 'cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-900/60' : ''}" ${h.listed ? `onclick="openStockDetail('${escHtml(h.code)}')"` : ''}>
            <td class="py-2"><b>${escHtml(h.name)}</b> <span class="font-mono text-[10px] text-slate-400">${escHtml(h.code)}</span>${h.listed ? '' : ' <span class="text-[9px] text-amber-600">未收錄</span>'}</td>
            <td class="text-right font-mono">${jnFmt(h.shares)}</td><td class="text-right font-mono">${jnFmt(h.avg, 2)}</td>
            <td class="text-right font-mono ${h.dayPct > 0 ? 'text-stockRed' : (h.dayPct < 0 ? 'text-stockGreen' : '')}">${h.price ?? '--'}</td>
            <td class="text-right font-mono ${jnCol(h.unreal)}">${h.unreal === null ? '--' : jnSigned(h.unreal)}<div class="text-[10px]">${h.unreal === null ? '' : jnPct(h.unreal / h.cost * 100)}</div></td>
            <td class="text-right font-mono ${jnCol(h.realized)}">${h.realized ? jnSigned(h.realized) : '--'}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
        ${closed.length ? `<details class="text-xs"><summary class="cursor-pointer text-slate-500">已出清（${closed.length} 檔）</summary><div class="mt-2 space-y-1">${closed.map(h => `<div class="flex justify-between"><span>${escHtml(h.name)} <span class="font-mono text-slate-400">${escHtml(h.code)}</span></span><span class="font-mono ${jnCol(h.realized)}">${jnSigned(h.realized)}</span></div>`).join('')}</div></details>` : ''}
        <div>
          <div class="text-xs font-bold text-slate-700 dark:text-slate-200 mb-1.5">交易紀錄</div>
          <div class="max-h-[360px] overflow-y-auto space-y-1">${pzState.trades.slice().sort((a, b) => b.date.localeCompare(a.date)).map(t => `
            <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px] py-1.5 border-b border-slate-100 dark:border-slate-800/60">
              <span class="font-mono text-slate-500">${escHtml(t.date)}</span>
              <span class="px-1.5 rounded font-bold ${t.side === '賣出' ? 'bg-emerald-500/10 text-emerald-600' : 'bg-red-500/10 text-red-600'}">${escHtml(t.side)}</span>
              <b>${escHtml(t.name || pzName(t.code) || t.code)}</b><span class="font-mono text-slate-400">${escHtml(t.code)}</span>
              <span class="font-mono">${jnFmt(t.shares)} 股 @ ${t.price}</span><span class="text-slate-400 font-mono">費 ${t.fee}${t.tax ? '・稅 ' + t.tax : ''}</span>
              ${t.reason ? `<span class="px-1.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escHtml(t.reason)}</span>` : ''}
              <span class="ml-auto whitespace-nowrap"><button onclick="pzEditTrade=Object.assign({}, pzState.trades.find(x=>x.id==='${t.id}')); renderManualJournal(); window.scrollTo({top:0,behavior:'smooth'})" class="${pzBtnGhost}">編輯</button> <button onclick="pzDelete('deleteTrade','${t.id}')" class="${pzBtnGhost}">刪除</button></span>
            </div>`).join('') || '<div class="py-6 text-center text-xs text-slate-400">還沒有交易紀錄，按「記一筆交易」開始</div>'}</div>
        </div>
        <details class="rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs">
          <summary class="cursor-pointer text-slate-500"><i class="fa-solid fa-link mr-1"></i>已經有自己的投資日誌試算表？改用連結</summary>
          <div class="mt-2 space-y-2 text-slate-600 dark:text-slate-300">
            <ol class="list-decimal pl-5 space-y-1 text-[11px]"><li>試算表「共用」給 <code class="font-mono">${ADMIN_SHARE_EMAIL}</code>（檢視者）</li><li>「資料中心」S2 填你的登入信箱 <code class="font-mono">${escHtml(currentUser.email)}</code></li><li>貼上試算表編輯網址後連結；連結後日誌改讀試算表，手動紀錄仍保留</li></ol>
            <div class="flex flex-col sm:flex-row gap-2"><input id="journalUrlInput" type="url" placeholder="https://docs.google.com/spreadsheets/d/…/edit" class="${pzInput} flex-1"><button onclick="linkJournal()" class="${pzBtn}">驗證並連結</button></div>
            <p id="journalLinkMsg" class="text-[11px] text-slate-500"></p>
          </div>
        </details>`);
      if (showForm) pzTradeCalc(false);
      const nav = pzState.nav;
      if (nav.length >= 2) lineChart('pz_nav', nav.map(n => n.date), [{ name: '淨值', values: nav.map(n => n.value), color: JN_COLORS.a, area: true }, { name: '成本', values: nav.map(n => n.cost), color: JN_COLORS.muted, dash: true }], v => jnFmt(v));
      else { const el = document.getElementById('pz_nav'); if (el) el.innerHTML = '<div class="h-full flex items-center justify-center text-[11px] text-slate-400">資料累積中</div>'; }
      donutChart('pz_alloc', open.map(h => ({ name: h.name, code: h.code, val: h.value ?? h.cost, type: /^00/.test(h.code) ? 'etf' : 'stock' })));
    }
    function pzTradeCalc(fromInput) {
      const code = (document.getElementById('pzJ_code') || {}).value || '';
      const side = document.getElementById('pzJ_side').value;
      const sh = parseFloat(document.getElementById('pzJ_shares').value), px = parseFloat(document.getElementById('pzJ_price').value);
      const nm = document.getElementById('pzJ_name'); if (nm) nm.textContent = pzName(code);
      const un = document.getElementById('pzJ_unlisted'); if (un && fromInput) un.innerHTML = code.length >= 4 ? pzUnlistedHtml(code, 'pzJ_req') : '';
      const amt = sh > 0 && px > 0 ? sh * px : 0;
      const feeEl = document.getElementById('pzJ_fee'), taxEl = document.getElementById('pzJ_tax');
      if (amt && !feeEl.dataset.manual && !(pzEditTrade && pzEditTrade.id && !fromInput)) feeEl.value = pzFee(amt);
      if (amt && !taxEl.dataset.manual && !(pzEditTrade && pzEditTrade.id && !fromInput)) taxEl.value = side === '賣出' ? pzTax(code, amt) : 0;
      const a = document.getElementById('pzJ_amt'); if (a) a.textContent = amt ? `成交金額 ${jnFmt(amt)}` : '';
    }
    async function pzSaveTrade() {
      const g = id => document.getElementById(id).value;
      const code = g('pzJ_code').trim();
      if (!/^[0-9A-Z]{4,6}$/.test(code)) { pzToast('請輸入正確的股票代號', true); return; }
      const shares = parseInt(g('pzJ_shares'), 10), price = parseFloat(g('pzJ_price'));
      if (!(shares > 0) || !(price > 0)) { pzToast('請輸入股數與價格', true); return; }
      if (g('pzJ_side') === '賣出') {
        const held = (pzPortfolio().holdings.find(h => h.code === code) || { shares: 0 }).shares + (pzEditTrade && pzEditTrade.id && pzEditTrade.side === '賣出' ? pzEditTrade.shares : 0);
        if (shares > held && !confirm(`目前紀錄持有 ${held} 股，賣出 ${shares} 股超過持股，仍要儲存嗎？`)) return;
      }
      try {
        const r = await pzPost('saveTrade', { id: pzEditTrade && pzEditTrade.id, date: g('pzJ_date'), code, name: pzName(code), side: g('pzJ_side'), shares, price, fee: parseFloat(g('pzJ_fee')) || 0, tax: parseFloat(g('pzJ_tax')) || 0, reason: g('pzJ_reason'), note: g('pzJ_note') });
        if (!r.success) { pzToast(r.message || '儲存失敗', true); return; }
        pzToast('已記錄'); pzEditTrade = null; journalState.manualForm = false; await pzLoad(true);
      } catch (e) { pzToast(e.message, true); }
    }

    // =====================================================================
    // ❓ 使用說明
    // =====================================================================
    function openPzHelp() {
      let m = document.getElementById('pzHelpModal');
      if (!m) {
        m = document.createElement('div');
        m.id = 'pzHelpModal';
        m.className = 'fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4';
        m.onclick = e => { if (e.target === m) m.remove(); };
        document.body.appendChild(m);
      }
      const L = pzState.limits || { track: 3, alert: 5 };
      const sec = (icon, title, items) => `<div class="space-y-1.5"><h4 class="text-sm font-black text-slate-900 dark:text-slate-100"><i class="fa-solid ${icon} mr-1.5"></i>${title}</h4><ul class="list-disc pl-5 space-y-1 text-xs text-slate-600 dark:text-slate-300">${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
      m.innerHTML = `<div class="w-full sm:max-w-2xl bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[88vh] overflow-y-auto p-5 sm:p-6 space-y-5">
        <div class="flex items-center justify-between"><h3 class="text-base font-black text-slate-900 dark:text-slate-100"><i class="fa-solid fa-circle-question text-brand-500 mr-1.5"></i>個人化使用說明</h3><button onclick="document.getElementById('pzHelpModal').remove()" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button></div>
        ${sec('fa-star text-amber-400', '關注清單', ['在首頁清單或個股詳情點 ⭐ 加入；卡片會顯示漲跌、十日走勢、量能與新高標籤。', '關注的股票若被列為<b>處置股</b>（橘色）或<b>注意股</b>（淡黃）會在頁首提醒；兩者都是時以處置為準。', '處置期間是分盤撮合、成交量自然變小，系統會暫停「窒息量／量縮」判斷避免誤判。'])}
        ${sec('fa-bell text-amber-500', '到價提醒', ['到「提醒」分頁輸入代號、條件（漲到 ≥／跌到 ≤）與目標價；可設定「提前 N%」先通知即將到價。', `需勾選「寄信提醒」才會寄信到你的登入信箱，<b>隨時可以取消勾選關閉</b>；也可單獨停用某一筆。`, '盤中（09:00–13:40）每 10 分鐘檢查一次，「即將到價」與「已到價」每天各最多寄一封。', `用量上限：初級韭菜 5 筆、資深韭菜 20 筆、萬年韭皇無上限（你目前 ${L.alert >= 9999 ? '無上限' : L.alert + ' 筆'}）。`])}
        ${sec('fa-thumbtack text-brand-500', '長期追蹤', ['在個股詳情按「長期追蹤」或到「長期追蹤」分頁輸入代號。', '每個交易日收盤後自動記錄收盤價、漲跌幅、成交量、最高與最低，存在後端，換裝置也看得到。', '從加入當天開始累積，至少兩天後顯示走勢圖；取消追蹤不會刪除已記錄的歷史。', `用量上限：初級韭菜 3 檔、資深韭菜 10 檔、萬年韭皇無上限（你目前 ${L.track >= 9999 ? '無上限' : L.track + ' 檔'}）。`])}
        ${sec('fa-pen text-emerald-500', '投資筆記', ['記下觀察、買進理由、賣出檢討、心得或重大事件；可指定股票，也可以只寫大盤心得。', '可搜尋、編輯、刪除；建議買進時寫下理由與停損條件，賣出後回頭檢討。'])}
        ${sec('fa-book-open text-indigo-500', '投資日誌', ['<b>預設為手動記帳</b>：按「記一筆交易」輸入日期、代號、買賣、股數、價格；手續費與交易稅會自動試算，可依券商折扣修改。', '以平均成本法計算持股、未實現與已實現損益；每日收盤後自動記錄一次資產淨值，累積成走勢圖。', '已經有自己的投資日誌試算表，可在頁面下方「改用連結」，連結後改讀你的試算表。', '只有你本人登入時看得到你的日誌。'])}
        ${sec('fa-envelope text-rose-500', '股票沒有收錄？', ['輸入不在收錄清單的代號時，會出現已填好內容的申請信，按「寄給管理員申請收錄」即可。', '未收錄的股票仍可記帳、設提醒與長期追蹤（後端直接查證交所），只是網頁上無法顯示即時價格與標籤，日誌市值暫以成本計算。'])}
        <p class="text-[10px] text-slate-400">所有資料僅供個人紀錄參考，不構成投資建議。</p>
      </div>`;
    }
  </script>
</body>
</html>
