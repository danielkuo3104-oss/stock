          <text x="${C}" y="${C + 10}" text-anchor="middle" font-size="12" font-weight="800" font-family="ui-monospace,monospace" class="fill-slate-900 dark:fill-slate-100">${axisLabel(total)}</text></svg>
        <div class="flex-1 w-full space-y-1">
          <div class="${opts.split ? 'flex' : 'hidden'} items-center gap-2 text-[10px] text-slate-500 dark:text-slate-400 mb-1">
            <span>個股 ${(100 - etfV / total * 100).toFixed(1)}%</span>
            <div class="flex-1 h-1.5 rounded-full overflow-hidden flex bg-slate-200 dark:bg-slate-800"><div class="bg-amber-500" style="width:${100 - etfV / total * 100}%"></div><div class="bg-teal-600" style="width:${etfV / total * 100}%"></div></div>
            <span>ETF ${(etfV / total * 100).toFixed(1)}%</span>
          </div>
          ${parts.map(p => `<div ${p.other ? 'onclick="toggleAllocMore()"' : ''} class="flex items-center justify-between gap-2 text-[11px] ${p.other ? 'cursor-pointer rounded hover:bg-slate-100 dark:hover:bg-slate-900' : ''}"><span class="flex items-center gap-1.5 min-w-0"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${p.color}"></span><span class="truncate text-slate-700 dark:text-slate-200">${escHtml(p.name)}</span>${p.other ? `<span class="text-[10px] text-brand-600 dark:text-brand-400 shrink-0">${opts.more ? '收合 ▲' : '查看 ▼'}</span>` : ''}</span><span class="font-mono text-slate-500 dark:text-slate-400 shrink-0">${(p.val / total * 100).toFixed(1)}%</span></div>`).join('')}
          ${opts.more && restItems.length ? `<div class="mt-1 ml-4 pl-2 border-l-2 border-slate-200 dark:border-slate-800 space-y-0.5 max-h-40 overflow-y-auto">${restItems.map(h => `<div class="flex items-center justify-between gap-2 text-[10px]"><span class="truncate text-slate-600 dark:text-slate-300">${escHtml(h.name)} <span class="font-mono text-slate-400">${escHtml(h.code)}</span></span><span class="font-mono text-slate-500 shrink-0">${jnFmt(h.val)}・${(h.val / total * 100).toFixed(1)}%</span></div>`).join('')}</div>` : ''}
        </div></div>`;
      const leg = document.getElementById(id + '_legend'); if (leg) leg.innerHTML = '';
    }

    function contribChart(id, items) {
      const el = document.getElementById(id);
      if (!el) return;
      if (!items.length) { el.innerHTML = '<div class="py-8 text-center text-[11px] text-slate-400">暫無資料</div>'; return; }
      const list = [...items].sort((a, b) => b.totalPlDiv - a.totalPlDiv);
      const maxAbs = Math.max(...list.map(h => Math.abs(h.totalPlDiv)), 1);
      el.innerHTML = `<div class="space-y-1.5 max-h-[260px] overflow-y-auto pr-1">${list.map(h => {
        const w = Math.max(Math.abs(h.totalPlDiv) / maxAbs * 50, 0.8), left = h.totalPlDiv < 0 ? 50 - w : 50;
        return `<div class="grid grid-cols-[6rem_1fr_4.5rem] items-center gap-2 text-[11px]" title="${escHtml(h.name)}：加總損益 ${jnSigned(h.totalPl)}、含息 ${jnSigned(h.totalPlDiv)}">
          <span class="truncate ${h.shares > 0 ? 'text-slate-700 dark:text-slate-200' : 'text-slate-400 dark:text-slate-500'}">${escHtml(h.name)}${h.shares > 0 ? '' : ' <span class="text-[9px]">出清</span>'}</span>
          <div class="relative h-3 rounded bg-slate-200/70 dark:bg-slate-800"><div class="absolute inset-y-0 left-1/2 w-px bg-slate-400/70"></div><div class="absolute inset-y-0 rounded-sm ${h.totalPlDiv >= 0 ? 'bg-stockRed' : 'bg-stockGreen'}" style="left:${left}%;width:${w}%;opacity:${h.shares > 0 ? 1 : 0.35}"></div></div>
          <span class="text-right font-mono font-bold ${jnCol(h.totalPlDiv)}" style="opacity:${h.shares > 0 ? 1 : 0.5}">${jnSigned(h.totalPlDiv)}</span></div>`;
      }).join('')}</div>`;
      const leg = document.getElementById(id + '_legend'); if (leg) leg.innerHTML = '<span class="text-slate-400">◀ 虧損　獲利 ▶・淡色＝已出清</span>';
    }

    // =====================================================================
    // 已了結損益（含已出清與部分賣出）
    // =====================================================================
    function jnRealized(holdings, scope) {
      const list = holdings.filter(h => scope === 'total' || (scope === 'etf' ? h.type === 'etf' : h.type === 'stock'))
        .map(h => ({ ...h, rz: h.realized !== null && h.realized !== undefined ? h.realized : (!(h.shares > 0) ? (h.totalPl || 0) : 0) }))
        .filter(h => h.rz);
      return { list: list.sort((a, b) => b.rz - a.rz), total: list.reduce((a, h) => a + h.rz, 0),
        div: holdings.filter(h => scope === 'total' || (scope === 'etf' ? h.type === 'etf' : h.type === 'stock')).reduce((a, h) => a + (h.dividend || 0), 0),
        closed: list.filter(h => !(h.shares > 0)).length };
    }
    function jnRealizedHtml(RZ) {
      if (!RZ.list.length) return '';
      const win = RZ.list.filter(h => h.rz > 0), lose = RZ.list.filter(h => h.rz < 0);
      return `<details class="mt-3" ${journalState.realizedOpen ? 'open' : ''} ontoggle="journalState.realizedOpen=this.open">
        <summary class="cursor-pointer text-xs font-bold text-slate-600 dark:text-slate-300 select-none">已了結損益明細 <span class="font-mono ${jnCol(RZ.total)}">${jnSigned(RZ.total)}</span>
          <span class="font-normal text-slate-400">・${RZ.list.length} 檔（已出清 ${RZ.closed}）・獲利 ${win.length} 檔 ${jnSigned(win.reduce((a, h) => a + h.rz, 0))}／虧損 ${lose.length} 檔 ${jnSigned(lose.reduce((a, h) => a + h.rz, 0))}</span></summary>
        <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
          ${RZ.list.map(h => `<div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-[11px] ${h.shares > 0 ? '' : 'opacity-75'}">
            <span class="min-w-0 truncate"><b class="text-slate-800 dark:text-slate-100">${escHtml(h.name)}</b> <span class="text-slate-400 font-mono">${escHtml(h.code)}</span>
              <span class="ml-1 text-[9px] px-1 rounded ${h.shares > 0 ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'}">${h.shares > 0 ? '部分賣出' : '已出清'}</span></span>
            <span class="font-mono font-bold shrink-0 ${jnCol(h.rz)}">${jnSigned(h.rz)}${h.realizedPct !== null && h.realizedPct !== undefined ? `<span class="text-[10px] font-normal ml-1">${jnPct(h.realizedPct)}</span>` : ''}</span></div>`).join('')}
        </div></details>`;
    }

    // =====================================================================
    // 寫入日誌（買賣原因 / 配息）— 需把日誌共用給管理員「編輯者」
    // =====================================================================
    function jnWriteBanner() {
      const m = journalState.writeMsg; if (!m) return '';
      const cls = m.ok ? 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border-emerald-200/70 dark:border-emerald-500/20'
                       : 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 border-amber-200/70 dark:border-amber-500/20';
      return `<div class="mt-3 flex items-start justify-between gap-2 text-[11px] border rounded-xl px-3 py-2 ${cls}">
        <span><i class="fa-solid ${m.ok ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-1"></i>${escHtml(m.text)}${m.code === 'READONLY' ? `<br><span class="text-slate-500">共用對象：<code class="font-mono">${ADMIN_SHARE_EMAIL}</code> → 權限改成「編輯者」。讀取不受影響。</span>` : ''}</span>
        <button onclick="journalState.writeMsg=null; renderJournal()" class="shrink-0 opacity-60 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button></div>`;
    }
    const jnTradeKey = t => t.sheet + '|' + t.row + '|' + t.col;
    const jnIsBuy = t => String(t.side || '').indexOf('賣') < 0;
    const JN_UNFILLED = '尚未填寫';
    function jnReasonOptions(t) {
      const L = (journalState.data && journalState.data.reasonLists) || {};
      return (jnIsBuy(t) ? L.buy : L.sell) || [];
    }
    function jnReasonChip(t) {
      const editable = !!(t.sheet && t.row && t.col);
      const unfilled = !t.reason || t.reason === JN_UNFILLED;
      if (editable && journalState.reasonEdit === jnTradeKey(t)) return jnReasonSelect(t, `jnSaveOne('${jnTradeKey(t)}', this.value)`) + `<button onclick="event.stopPropagation(); journalState.reasonEdit=null; renderJournal()" class="text-[10px] text-slate-400">取消</button>`;
      const label = unfilled ? (t.reason ? '原因未填' : '') : escHtml(t.reason);
      if (!editable) return label ? `<span class="px-1.5 rounded ${unfilled ? 'text-slate-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${label}</span>` : '';
      return `<button onclick="event.stopPropagation(); journalState.reasonEdit='${jnTradeKey(t)}'; renderJournal()" title="點擊編輯買賣原因"
        class="px-1.5 rounded ${unfilled ? 'border border-dashed border-amber-400 text-amber-600 dark:text-amber-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:ring-1 hover:ring-brand-400'}">${label || '填寫原因'} <i class="fa-solid fa-pen text-[8px] opacity-60"></i></button>`;
    }
    function jnReasonSelect(t, onchange, value) {
      const opts = jnReasonOptions(t), cur = value !== undefined ? value : t.reason;
      if (!opts.length) return `<input type="text" value="${escHtml(cur && cur !== JN_UNFILLED ? cur : '')}" placeholder="原因" onclick="event.stopPropagation()" onchange="${onchange}" class="w-28 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-1.5 py-0.5 text-[11px]">`;
      return `<select onclick="event.stopPropagation()" onchange="${onchange}" class="bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-1 py-0.5 text-[11px] max-w-[11rem]">
        <option value="${JN_UNFILLED}" ${!cur || cur === JN_UNFILLED ? 'selected' : ''}>${JN_UNFILLED}</option>
        ${opts.filter(o => o !== JN_UNFILLED).map(o => `<option ${o === cur ? 'selected' : ''}>${escHtml(o)}</option>`).join('')}</select>`;
    }
    function jnFindTrade(key) { return ((journalState.data || {}).trades || []).find(t => jnTradeKey(t) === key); }
    function jnSaveOne(key, reason) {
      const t = jnFindTrade(key); if (!t) return;
      journalState.reasonEdit = null;
      if (reason === t.reason) { renderJournal(); return; }
      jnSaveReasons([{ t, reason }]);
    }
    async function jnSaveReasons(items) {
      if (journalState.saving || !items.length) return;
      journalState.saving = true; journalState.writeMsg = { ok: true, text: '寫入日誌中…（' + items.length + ' 筆）' }; renderJournal();
      try {
        const r = await journalPost({ action: 'updateTradeReasons', email: currentUser.email, token: currentUser.token,
          updates: items.map(({ t, reason }) => ({ sheet: t.sheet, row: t.row, col: t.col, code: t.code, date: t.date, reason })) }, 60000);
        (r.done || []).forEach(d => { const t = jnFindTrade(d.sheet + '|' + d.row + '|' + d.col); if (t) t.reason = d.reason; delete journalState.pendingDraft[d.sheet + '|' + d.row + '|' + d.col]; });
        journalState.writeMsg = { ok: !!r.success, code: r.code, text: r.message || (r.success ? '已更新' : '寫入失敗') };
      } catch (e) { journalState.writeMsg = { ok: false, text: '連線失敗：' + ((e && e.message) || e) }; }
      journalState.saving = false; renderJournal();
    }

    // ---------- 買賣原因統計 ----------
    function setReasonScope(v) { journalState.reasonScope = v; renderJournal(); }
    function jnReasonCard(J) {
      const trades = (J.trades || []);
      const editable = trades.some(t => t.sheet && t.row);
      const lists = J.reasonLists || null;
      const priceOf = {}; (J.holdings || []).forEach(h => { if (h.price > 0) priceOf[h.code] = h.price; });
      const codes = []; trades.forEach(t => { if (!codes.some(c => c.code === t.code)) codes.push({ code: t.code, name: t.name }); });
      const sc = journalState.reasonScope !== 'all' && !codes.some(c => c.code === journalState.reasonScope) ? 'all' : journalState.reasonScope;
      const pool = sc === 'all' ? trades : trades.filter(t => t.code === sc);
      const pending = trades.filter(t => t.reason === JN_UNFILLED);
      const group = side => {
        const m = {};
        pool.filter(t => (side === 'buy') === jnIsBuy(t) && t.reason && t.reason !== JN_UNFILLED).forEach(t => {
          const g = m[t.reason] = m[t.reason] || { reason: t.reason, n: 0, amt: 0, rets: [] };
          g.n++; g.amt += (t.shares || 0) * (t.price || 0);
          const now = priceOf[t.code];
          if (now && t.price > 0) g.rets.push(side === 'buy' ? (now / t.price - 1) * 100 : (t.price / now - 1) * 100);
        });
        return Object.values(m).sort((a, b) => b.n - a.n);
      };
      const block = (side, arr) => {
        const max = Math.max(1, ...arr.map(g => g.n)), tot = arr.reduce((a, g) => a + g.n, 0);
        const unf = pool.filter(t => (side === 'buy') === jnIsBuy(t) && t.reason === JN_UNFILLED).length;
        return `<div class="min-w-0">
          <div class="flex items-center justify-between mb-1.5"><h4 class="text-xs font-bold ${side === 'buy' ? 'text-stockRed' : 'text-stockGreen'}">${side === 'buy' ? '買入原因' : '賣出原因'} <span class="font-normal text-slate-400">${tot} 筆${unf ? `・未填 ${unf}` : ''}</span></h4>
            <span class="text-[9px] text-slate-400">${side === 'buy' ? '報酬＝現價 ÷ 買價' : '報酬＝賣價 ÷ 現價（正＝賣得比現在高）'}</span></div>
          ${arr.length ? `<div class="space-y-1">${arr.map(g => {
            const avg = g.rets.length ? g.rets.reduce((a, b) => a + b, 0) / g.rets.length : null, wr = g.rets.length ? g.rets.filter(x => x > 0).length / g.rets.length * 100 : null;
            return `<div class="grid grid-cols-[minmax(0,6rem)_1fr] sm:grid-cols-[minmax(0,7.5rem)_1fr_9.5rem] items-center gap-x-2 gap-y-0.5 text-[11px]">
              <span class="truncate text-slate-700 dark:text-slate-200" title="${escHtml(g.reason)}">${escHtml(g.reason)}</span>
              <div class="relative h-4 rounded bg-slate-200/70 dark:bg-slate-800 overflow-hidden"><div class="absolute inset-y-0 left-0 ${side === 'buy' ? 'bg-red-500/60' : 'bg-green-500/60'}" style="width:${g.n / max * 100}%"></div><span class="absolute inset-0 px-1.5 flex items-center text-[10px] font-mono font-bold text-slate-800 dark:text-slate-100">${g.n} 筆・${(g.n / tot * 100).toFixed(0)}%</span></div>
              <span class="col-start-2 sm:col-start-auto font-mono text-[10px] sm:text-right whitespace-nowrap"><span class="text-slate-400">${axisLabel(g.amt)}</span> <b class="${jnCol(avg)}">${avg === null ? '--' : jnPct(avg, 1)}</b>${wr === null ? '' : `<span class="text-slate-400"> 勝${wr.toFixed(0)}%</span>`}</span></div>`;
          }).join('')}</div>` : '<div class="py-3 text-center text-[11px] text-slate-400">沒有已填寫原因的交易</div>'}
        </div>`;
      };
      const pendingHtml = !pending.length ? '' : `
        <div class="mt-4 rounded-xl border border-amber-300/70 dark:border-amber-500/30 bg-amber-50/60 dark:bg-amber-500/5 p-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-bold text-amber-700 dark:text-amber-400"><i class="fa-solid fa-pen-to-square mr-1"></i>尚未填寫原因：${pending.length} 筆</span>
            ${editable ? `<button onclick="journalState.pendingOpen=!journalState.pendingOpen; renderJournal()" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-500 hover:bg-amber-400 text-white">${journalState.pendingOpen ? '收合' : '逐筆填寫'}</button>` : '<span class="text-[10px] text-slate-500">按右上角「重新讀取」後即可在此填寫</span>'}
          </div>
          ${journalState.pendingOpen && editable ? `
            <div class="mt-2 max-h-80 overflow-y-auto divide-y divide-amber-200/60 dark:divide-amber-500/10">
              ${pending.map(t => { const key = jnTradeKey(t), dv = journalState.pendingDraft[key]; return `<div class="flex flex-wrap items-center gap-x-3 gap-y-1 py-1.5 text-[11px]">
                <span class="font-mono text-slate-400 w-20">${escHtml(t.date)}</span>
                <span class="px-1.5 rounded text-[10px] font-bold ${jnIsBuy(t) ? 'bg-red-500/10 text-stockRed' : 'bg-green-500/10 text-stockGreen'}">${escHtml(t.side || '-')}</span>
                <span class="font-bold text-slate-800 dark:text-slate-100">${escHtml(t.name)}</span><span class="font-mono text-slate-400">${jnFmt(t.shares)} 股 @ ${jnFmt(t.price, 2)}</span>
                <span class="ml-auto">${jnReasonSelect(t, `jnDraftReason('${key}', this.value)`, dv)}</span></div>`; }).join('')}
            </div>
            <div class="mt-2 flex items-center justify-end gap-2">
              <span class="text-[10px] text-slate-500">已選 ${Object.keys(journalState.pendingDraft).filter(k => journalState.pendingDraft[k] && journalState.pendingDraft[k] !== JN_UNFILLED).length} 筆</span>
              <button onclick="jnSavePending()" ${journalState.saving ? 'disabled' : ''} class="px-3 py-1 rounded-lg text-[11px] font-bold bg-brand-600 hover:bg-brand-500 text-white disabled:opacity-50">${journalState.saving ? '<i class="fa-solid fa-spinner fa-spin mr-1"></i>寫入中' : '寫入日誌'}</button>
            </div>` : ''}
        </div>`;
      return `
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-lightbulb text-brand-500"></i>買賣原因統計</h2>
          <div class="flex items-center gap-2">
            ${jnSeg(sc === 'all' ? 'all' : 'one', [['all', '綜合'], ['one', '個別']], 'jnReasonMode')}
            ${sc !== 'all' || journalState.reasonScopeOne ? `<select onchange="setReasonScope(this.value)" class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-[11px] max-w-[10rem]">
              ${codes.map(c => `<option value="${escHtml(c.code)}" ${c.code === sc ? 'selected' : ''}>${escHtml(c.name)} ${escHtml(c.code)}</option>`).join('')}</select>` : ''}
          </div>
        </div>
        ${!lists || (!lists.buy.length && !lists.sell.length) ? `<p class="text-[10px] text-slate-400 mb-2"><i class="fa-solid fa-circle-info mr-1"></i>${lists ? '讀不到日誌「資料中心」G2／H2 的下拉選單，編輯時改為自行輸入。' : '按右上角「重新讀取」可載入「資料中心」G2（買入）／H2（賣出）的原因選單。'}</p>` : ''}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${block('buy', group('buy'))}${block('sell', group('sell'))}</div>
        ${pendingHtml}
        <p class="mt-2 text-[10px] text-slate-400">交易紀錄的原因標籤可直接點擊修改，會寫回你的日誌（需共用為「編輯者」）。</p>`;
    }
    function jnReasonMode(v) {
      if (v === 'all') { journalState.reasonScope = 'all'; journalState.reasonScopeOne = false; }
      else { journalState.reasonScopeOne = true; const t = ((journalState.data || {}).trades || [])[0]; if (journalState.reasonScope === 'all' && t) journalState.reasonScope = t.code; }
      renderJournal();
    }
    function jnDraftReason(key, v) { journalState.pendingDraft[key] = v; }
    function jnSavePending() {
      const items = Object.keys(journalState.pendingDraft).filter(k => journalState.pendingDraft[k] && journalState.pendingDraft[k] !== JN_UNFILLED)
        .map(k => ({ t: jnFindTrade(k), reason: journalState.pendingDraft[k] })).filter(x => x.t);
      if (!items.length) { journalState.writeMsg = { ok: false, text: '請先在下拉選單選好原因' }; renderJournal(); return; }
      jnSaveReasons(items);
    }

    // ---------- 登記配息 ----------
    function jnOpenDividend(code) {
      const today = (typeof pfToday === 'function' ? pfToday() : new Date().toISOString().slice(0, 10));
      journalState.divOpen = code === '' ? !journalState.divOpen : true;
      journalState.divForm = { code: code || journalState.divForm.code || '', amount: '', date: today, note: '' };
      renderJournal();
      if (journalState.divOpen) setTimeout(() => { const el = document.getElementById('jnDivAmt'); if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus(); } }, 50);
    }
    function jnDividendForm(holdings) {
      const f = journalState.divForm, list = [...holdings].sort((a, b) => (b.shares > 0) - (a.shares > 0) || (b.value || 0) - (a.value || 0));
      const h = list.find(x => x.code === f.code);
      const inp = 'w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs';
      const lab = (t, inner) => `<label class="block"><span class="block text-[10px] text-slate-500 mb-0.5">${t}</span>${inner}</label>`;
      return `<div class="mb-3 rounded-xl border border-brand-200 dark:border-brand-500/30 bg-brand-50/50 dark:bg-brand-500/5 p-3 space-y-2">
        <div class="text-xs font-bold text-slate-800 dark:text-slate-100"><i class="fa-solid fa-coins text-brand-500 mr-1"></i>登記配息 <span class="font-normal text-[10px] text-slate-500">金額會加到日誌該股的「總配息」，並記錄在日誌新增的「配息紀錄」分頁</span></div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          ${lab('股票', `<select onchange="journalState.divForm.code=this.value; renderJournal()" class="${inp}"><option value="">選擇股票</option>${list.map(x => `<option value="${escHtml(x.code)}" ${x.code === f.code ? 'selected' : ''}>${escHtml(x.name)} ${escHtml(x.code)}${x.shares > 0 ? '' : '（已出清）'}</option>`).join('')}</select>`)}
          ${lab('實收金額（元）', `<input id="jnDivAmt" type="number" step="1" value="${escHtml(f.amount)}" oninput="journalState.divForm.amount=this.value" placeholder="例如 1250" class="${inp} font-mono">`)}
          ${lab('發放日', `<input type="date" value="${escHtml(f.date)}" oninput="journalState.divForm.date=this.value" class="${inp}">`)}
          ${lab('備註', `<input type="text" value="${escHtml(f.note)}" oninput="journalState.divForm.note=this.value" placeholder="例如 Q2 季配" maxlength="100" class="${inp}">`)}
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="text-[10px] text-slate-500">${h ? `目前總配息 <b class="font-mono">${jnFmt(h.dividend)}</b>・持有 ${jnFmt(h.shares)} 股` : ''}</span>
          <div class="flex gap-2"><button onclick="journalState.divOpen=false; renderJournal()" class="px-3 py-1 rounded-lg text-[11px] border border-slate-300 dark:border-slate-700">取消</button>
          <button onclick="jnSubmitDividend()" ${journalState.saving ? 'disabled' : ''} class="px-3 py-1 rounded-lg text-[11px] font-bold bg-brand-600 hover:bg-brand-500 text-white disabled:opacity-50">${journalState.saving ? '<i class="fa-solid fa-spinner fa-spin mr-1"></i>寫入中' : '加總寫入'}</button></div>
        </div></div>`;
    }
    async function jnSubmitDividend() {
      const f = journalState.divForm, amt = Number(f.amount);
      if (!f.code || !isFinite(amt) || !amt) { journalState.writeMsg = { ok: false, text: '請選擇股票並輸入配息金額' }; renderJournal(); return; }
      const h = (journalState.data.holdings || []).find(x => x.code === f.code);
      if (!confirm(`確定登記 ${h ? h.name : f.code} 配息 ${jnFmt(amt)} 元？\n總配息 ${jnFmt(h && h.dividend)} → ${jnFmt(((h && h.dividend) || 0) + amt)}`)) return;
      journalState.saving = true; renderJournal();
      try {
        const r = await journalPost({ action: 'addDividend', email: currentUser.email, token: currentUser.token, code: f.code, amount: amt, date: f.date, note: f.note }, 60000);
        if (r.success) {
          (journalState.data.holdings || []).forEach(x => { if (x.code === f.code) { x.dividend = r.after; if (x.totalPlDiv !== null && x.totalPlDiv !== undefined) x.totalPlDiv += amt; } });
          journalState.divOpen = false;
          journalState.writeMsg = { ok: true, text: r.message + '（淨值與報酬率會在日誌重新計算後更新）' };
        } else journalState.writeMsg = { ok: false, code: r.code, text: r.message || '寫入失敗' };
      } catch (e) { journalState.writeMsg = { ok: false, text: '連線失敗：' + ((e && e.message) || e) }; }
      journalState.saving = false; renderJournal();
    }

    // =====================================================================
    // K 線＋成交量（長期追蹤用）bars = [{date, open, high, low, close, vol}]
    // =====================================================================
    function candleChart(id, bars) {
      const el = document.getElementById(id); if (!el) return;
      const ok = v => v !== null && v !== undefined && !isNaN(v) && v > 0;
      const B = bars.filter(b => ok(b.close)).map((b, i, a) => {
        const prev = i ? a[i - 1].close : null;
        const open = ok(b.open) ? b.open : (prev || b.close);
        return { ...b, open, approx: !ok(b.open), high: Math.max(ok(b.high) ? b.high : -Infinity, open, b.close), low: Math.min(ok(b.low) ? b.low : Infinity, open, b.close), prev };
      });
      if (B.length < 2) { el.innerHTML = '<div class="h-full flex items-center justify-center text-[11px] text-slate-400">資料不足</div>'; return; }
      const ma = k => B.map((b, i) => i + 1 < k ? null : B.slice(i + 1 - k, i + 1).reduce((a, x) => a + x.close, 0) / k);
      const ma5 = ma(5), ma20 = ma(20);
      const leg = document.getElementById(id + '_legend');
      if (leg) leg.innerHTML = `<span class="text-stockRed">■ 漲</span><span class="text-stockGreen">■ 跌</span><span class="inline-flex items-center gap-1 text-slate-500"><span class="inline-block w-3 h-0.5 rounded" style="background:#f59e0b"></span>MA5</span>${B.length >= 20 ? '<span class="inline-flex items-center gap-1 text-slate-500"><span class="inline-block w-3 h-0.5 rounded" style="background:#c026d3"></span>MA20</span>' : ''}`;
      const W = Math.max(el.clientWidth, 260), Hh = Math.max(el.clientHeight, 260);
      const padL = 44, padR = 6, padT = 8, padB = 18, gap = 10;
      const volH = Math.round((Hh - padT - padB) * 0.26), pxH = Hh - padT - padB - volH - gap;
      const hiV = Math.max(...B.map(b => b.high)), loV = Math.min(...B.map(b => b.low));
      const { lo, hi, ticks } = niceTicks(loV, hiV);
      const vols = B.map(b => ok(b.vol) ? b.vol : 0), vMax = Math.max(1, ...vols);
      const n = B.length, slot = (W - padL - padR) / n, bw = Math.max(Math.min(slot * 0.7, 12), 1);
      const x = i => padL + i * slot + slot / 2;
      const y = v => padT + (1 - (v - lo) / (hi - lo || 1)) * pxH;
      const vy0 = padT + pxH + gap + volH, vy = v => vy0 - v / vMax * volH;
      const up = b => b.close > b.open || (b.close === b.open && b.prev !== null && b.close >= b.prev);
      let g = ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" stroke-opacity="0.1"/><text x="${padL - 5}" y="${y(t) + 3}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${t.toLocaleString('en-US')}</text>`).join('');
      g += `<line x1="${padL}" x2="${W - padR}" y1="${vy0}" y2="${vy0}" stroke="currentColor" stroke-opacity="0.2"/><text x="${padL - 5}" y="${vy(vMax) + 8}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity="0.6" font-family="ui-monospace,monospace">${axisLabel(vMax)}</text>`;
      B.forEach((b, i) => {
        const c = up(b) ? '#ef4444' : '#22c55e', cx = x(i).toFixed(1);
        const yo = y(b.open), yc = y(b.close), top = Math.min(yo, yc), h = Math.max(Math.abs(yc - yo), 1);
        g += `<line x1="${cx}" x2="${cx}" y1="${y(b.high).toFixed(1)}" y2="${y(b.low).toFixed(1)}" stroke="${c}" stroke-width="1"/>`;
        g += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" ${b.approx ? `fill-opacity="0.35" stroke="${c}" stroke-dasharray="2 1"` : ''}/>`;
        if (vols[i]) g += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${vy(vols[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(vy0 - vy(vols[i])).toFixed(1)}" fill="${c}" fill-opacity="0.55"/>`;
      });
      const line = (arr, col) => { const pts = arr.map((v, i) => v === null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean); return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.3"/>` : ''; };
      g += line(ma5, '#f59e0b') + line(ma20, '#c026d3');
      const li = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
      g += li.map((i, k) => `<text x="${x(i)}" y="${Hh - 4}" text-anchor="${k === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}" font-size="9" fill="currentColor" fill-opacity="0.75" font-family="ui-monospace,monospace">${B[i].date.slice(5).replace('-', '/')}</text>`).join('');
      g += `<line class="jc-cross" x1="0" x2="0" y1="${padT}" y2="${vy0}" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="2 2" visibility="hidden"/>`;
      g += `<rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${vy0 - padT}" fill="transparent"/>`;
      el.innerHTML = `<svg width="${W}" height="${Hh}" class="block text-slate-500 dark:text-slate-400">${g}</svg><div class="jc-tip hidden absolute top-1 z-10 pointer-events-none bg-slate-900/95 text-slate-100 text-[10px] font-mono rounded-lg px-2 py-1.5 shadow-xl border border-slate-700 whitespace-nowrap"></div>`;
      const f2 = v => ok(v) ? Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 }) : '--';
      attachHover(el, n, x, i => { const b = B[i], chg = b.prev ? (b.close / b.prev - 1) * 100 : null; return `<div class="font-bold text-slate-300 mb-0.5">${b.date}</div>
        <div>開 <b>${f2(b.open)}</b>${b.approx ? '<span class="text-slate-400">（估）</span>' : ''}　高 <b class="text-red-400">${f2(b.high)}</b></div>
        <div>收 <b>${f2(b.close)}</b>　低 <b class="text-green-400">${f2(b.low)}</b></div>
        <div>漲跌 <b class="${chg > 0 ? 'text-red-400' : (chg < 0 ? 'text-green-400' : '')}">${chg === null ? '--' : (chg > 0 ? '+' : '') + chg.toFixed(2) + '%'}</b>　量 <b>${vols[i] ? vols[i].toLocaleString() : '--'}</b></div>
        ${ma5[i] !== null ? `<div class="text-slate-400">MA5 ${f2(ma5[i])}${ma20[i] !== null ? '　MA20 ' + f2(ma20[i]) : ''}</div>` : ''}`; }, padL, W - padR);
    }

    let jnResizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(jnResizeTimer);
      jnResizeTimer = setTimeout(() => { if (personalTab === 'journal' && journalState.data) renderJournalCharts(journalState.data); }, 200);
    });

    // =====================================================================
    // 💡 個人化擴充：處置／注意提醒、到價提醒、長期追蹤、投資筆記、手動投資日誌、使用說明
    //    資料由後端「個人化.gs」保存（需信箱 + 登入 token），只能讀寫自己的資料
    // =====================================================================
    let pzState = { loaded: false, loading: false, error: '', tier: '', limits: { track: 3, alert: 5 }, settings: { emailAlerts: false }, alerts: [], tracks: [], history: {}, notes: [], trades: [], nav: [] };
    let pzEditAlert = null, pzEditNote = null, pzEditTrade = null, pzTrackSel = '', pzNoteFilter = '';
    const PZ_NOTE_TYPES = ['觀察', '買進理由', '賣出檢討', '心得', '事件'];
    const pzInput = 'bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-brand-500';
    const pzBtn = 'px-3 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold transition whitespace-nowrap';
    const pzBtnGhost = 'px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] text-slate-600 dark:text-slate-300 hover:border-brand-500 transition whitespace-nowrap';

    async function pzPost(action, payload = {}, ms = 30000) {
      if (!currentUser || !currentUser.token) throw new Error('請重新登入以取得驗證');
      const r = await journalPost({ action, email: currentUser.email, token: currentUser.token, ...payload }, ms);
      if (r && r.code === 'AUTH') throw new Error('登入已過期，請重新登入');
      return r;
    }
    async function pzLoad(force) {
      if (pzState.loading || (pzState.loaded && !force)) return;
      pzState.loading = true;
      try {
        const r = await pzPost('getPersonal', {}, 40000);
        if (r && r.success) { Object.assign(pzState, r, { loaded: true, error: '' }); }
        else pzState.error = (r && r.message) || '讀取失敗';
      } catch (e) { pzState.error = e.message || '連線失敗'; }
      pzState.loading = false;
      pzRenderActive();
    }
    function pzRenderActive() {
      if (personalTab === 'alerts') renderPzAlerts();
      else if (personalTab === 'track') renderPzTrack();
      else if (personalTab === 'notes') renderPzNotes();
      else if (personalTab === 'journal' && journalState.manual) renderManualJournal();
    }
    function pzNeedToken(boxId) {
      if (currentUser && currentUser.token) return false;
      document.getElementById(boxId).innerHTML = jnCard(`<div class="py-8 text-center space-y-3"><p class="text-xs text-slate-500">此功能需要登入驗證，請重新登入。</p><button onclick="logout()" class="${pzBtn}">重新登入</button></div>`);
      return true;
    }
    function pzStatusHtml() {
      if (pzState.loading && !pzState.loaded) return '<div class="py-10 text-center text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i>讀取中…</div>';
      if (pzState.error && !pzState.loaded) return `<div class="py-8 text-center space-y-2"><p class="text-xs text-amber-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${escHtml(pzState.error)}</p><button onclick="pzLoad(true)" class="${pzBtnGhost}">重試</button><p class="text-[10px] text-slate-400">若持續失敗，可能是後端尚未部署新版本（個人化.gs）</p></div>`;
      return '';
    }
    // 個人化各分頁的卡片：區塊之間留足間距
    function pzCard(inner) { return jnCard(`<div class="space-y-5 sm:space-y-6">${inner}</div>`); }
    function pzName(code) { const s = stockMap.get(code); return s ? s.name : ''; }
    function pzToast(msg, bad) {
      let el = document.getElementById('pzToast');
      if (!el) { el = document.createElement('div'); el.id = 'pzToast'; document.body.appendChild(el); }
      el.className = `fixed left-1/2 -translate-x-1/2 bottom-5 z-[80] px-4 py-2 rounded-xl text-xs font-bold shadow-2xl ${bad ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
      el.textContent = msg; el.style.display = 'block';
      clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
    }
    function pzTierLine(kind, used) {
      const lim = pzState.limits[kind];
      return `<span class="text-[10px] text-slate-500 dark:text-slate-400">用量 <b class="font-mono ${used >= lim ? 'text-amber-600' : ''}">${used} / ${lim >= 9999 ? '∞' : lim}</b>（${escHtml(pzState.tier || currentUser.tier || '')}）</span>`;
    }

    // ---------- 未收錄股票：建議寄信給管理員（內容已填好）----------
    function pzUnlistedHtml(code, boxId) {
      if (!/^[0-9A-Z]{4,6}$/.test(code) || stockMap.has(code)) return '';
      const body = `管理員您好：\n\n我想申請收錄以下股票：\n股票代號：${code}\n用途：個人化（投資日誌／提醒／追蹤）\n\n會員：${currentUser.name}（${currentUser.email}）`;
      return `<div class="mt-2 rounded-xl border border-amber-500/30 bg-amber-500/5 p-3 space-y-2 text-[11px]">
        <div class="text-amber-700 dark:text-amber-400 font-bold"><i class="fa-solid fa-circle-info mr-1"></i>${escHtml(code)} 不在收錄清單：仍可記錄，但網頁無法顯示即時價格與標籤</div>
        <textarea id="${boxId}_mail" rows="4" class="${pzInput} w-full">${escHtml(body)}</textarea>
        <div class="flex items-center gap-2"><button onclick="pzSendRequest('${boxId}', '${escHtml(code)}')" class="${pzBtn}"><i class="fa-solid fa-paper-plane mr-1"></i>寄給管理員申請收錄</button><span id="${boxId}_msg" class="text-slate-500"></span></div>
      </div>`;
    }
    async function pzSendRequest(boxId, code) {
      const msg = document.getElementById(boxId + '_msg');
      const body = (document.getElementById(boxId + '_mail') || {}).value || '';
      msg.textContent = '寄送中…';
      try {
        const r = await journalPost({ action: 'sendContactEmail', subject: `收錄申請 ${code}`, body, userEmail: currentUser.email, userName: currentUser.name });
        msg.textContent = r && r.success ? '已寄出，管理員收錄後即可顯示' : '寄送失敗：' + ((r && r.message) || '');
      } catch (e) { msg.textContent = '寄送失敗：無法連線'; }
    }
    function pzCodeInput(id, value, onchange) {
      return `<input id="${id}" list="pzCodeList" value="${escHtml(value || '')}" placeholder="代號，例 2330" oninput="this.value=this.value.toUpperCase().trim(); ${onchange || ''}" class="${pzInput} w-28 font-mono">`;
    }
    function pzCodeDatalist() {
      const ids = [...new Set([...userWatchlist, ...Array.from(stockMap.keys())])];
      return `<datalist id="pzCodeList">${ids.map(id => `<option value="${escHtml(id)}">${escHtml(pzName(id))}</option>`).join('')}</datalist>`;
    }

    // ---------- 關注清單的處置／注意提醒（頁首橫幅）----------
    function renderWatchAlerts() {
      const box = document.getElementById('watchAlertBanner');
      if (!box) return;
      const hits = userWatchlist.map(id => stockMap.get(id)).filter(s => s && (s.disposal || s.notice));
      if (!hits.length) { box.innerHTML = ''; box.classList.add('hidden'); return; }
      const item = s => {
        const d = s.disposal, n = s.notice;
        const txt = d ? `${d.state === 'active' ? (d.level >= 2 ? '再次處置中' : '處置中') : '即將處置'} ${pfShort(d.start)}～${pfShort(d.end)}` : `注意股（${pfShort(n.date)}）`;
        return `<button onclick="openStockDetail('${escHtml(s.id)}')" class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg ${d ? 'bg-orange-100 dark:bg-orange-500/15 text-orange-800 dark:text-orange-300' : 'bg-yellow-100 dark:bg-yellow-400/10 text-yellow-800 dark:text-yellow-300'} text-[11px] font-bold"><span>${escHtml(s.name)}</span><span class="font-normal">${escHtml(txt)}</span></button>`;
      };
      box.classList.remove('hidden');
      box.innerHTML = `<div class="flex flex-wrap items-center gap-2 rounded-2xl border border-orange-300/60 dark:border-orange-500/30 bg-white dark:bg-slate-900 px-3 py-2 shadow-sm">
        <span class="text-xs font-black text-orange-700 dark:text-orange-400"><i class="fa-solid fa-bell mr-1"></i>你的關注有處置／注意公告</span>${hits.map(item).join('')}</div>`;
    }

    // ---------- 個股詳情：快捷操作 ----------
    function pzAfterDetail(id) {
      const body = document.getElementById('stockDetailBody');
      if (!body || currentUser.role === 'guest') return;
      const tracked = pzState.tracks.some(t => t.code === id);
      const s = stockMap.get(id);
      const d = s && s.disposal, n = s && s.notice;
      body.insertAdjacentHTML('beforeend', `
        ${d || n ? `<div class="rounded-xl border ${d ? 'border-orange-400/50 bg-orange-50 dark:bg-orange-500/10' : 'border-yellow-400/50 bg-yellow-50 dark:bg-yellow-400/10'} px-3 py-2 text-[11px] leading-relaxed">
          <b class="${d ? 'text-orange-700 dark:text-orange-300' : 'text-yellow-700 dark:text-yellow-300'}">${d ? `${d.state === 'active' ? '處置中' : '即將處置'}・${escHtml(d.measure || '')}（${pfShort(d.start)}～${pfShort(d.end)}）` : `注意股・${pfShort(n.date)}`}</b>
          ${d ? '<div class="text-slate-500">處置期間為分盤撮合，量縮屬正常現象，已暫停窒息量等量縮判斷。</div>' : (n.reason ? `<div class="text-slate-500">${escHtml(n.reason)}</div>` : '')}
        </div>` : ''}
        <div class="flex flex-wrap gap-2 pt-1">
          <button onclick="closeStockDetail(); pzGoAlert('${escHtml(id)}')" class="${pzBtnGhost}"><i class="fa-solid fa-bell mr-1 text-amber-500"></i>到價提醒</button>
          <button id="pzTrackBtn" onclick="pzToggleTrack('${escHtml(id)}')" class="${pzBtnGhost} ${userWatchlist.includes(id) ? '' : 'hidden'}"><i class="fa-solid fa-thumbtack mr-1 ${tracked ? 'text-brand-500' : 'text-slate-400'}"></i>${tracked ? '已長期追蹤（點擊取消）' : '長期追蹤'}</button>
          <button onclick="closeStockDetail(); pzGoNote('${escHtml(id)}')" class="${pzBtnGhost}"><i class="fa-solid fa-pen mr-1 text-emerald-500"></i>寫筆記</button>
          <button onclick="closeStockDetail(); pzGoTrade('${escHtml(id)}')" class="${pzBtnGhost}"><i class="fa-solid fa-receipt mr-1 text-indigo-500"></i>記一筆交易</button>
        </div>`);
      if (!pzState.loaded) pzLoad(false).then(() => { const b = document.getElementById('pzTrackBtn'); if (b && pzState.tracks.some(t => t.code === id)) b.innerHTML = '<i class="fa-solid fa-thumbtack mr-1 text-brand-500"></i>已長期追蹤（點擊取消）'; });
    }
    function pzGoAlert(code) { pzEditAlert = { code, cond: 'gte', levels: [] }; switchPersonalTab('alerts'); }
    function pzGoNote(code) { pzEditNote = { code, type: '觀察' }; switchPersonalTab('notes'); }
    function pzGoTrade(code) { pzEditTrade = { code, side: '買進' }; journalState.manualForm = true; switchPersonalTab('journal'); }
    async function pzToggleTrack(code, fromTab) {
      await pzLoad(false);
      const on = !pzState.tracks.some(t => t.code === code);
      try {
        const r = await pzPost('setTrack', { code, name: pzName(code), on });
        if (!r.success) { pzToast(r.message || '設定失敗', true); return; }
        pzToast(on ? '已加入長期追蹤，每日收盤後記錄' : '已取消長期追蹤');
        await pzLoad(true);
        if (!fromTab && detailStockId === code) openStockDetail(code);
      } catch (e) { pzToast(e.message, true); }
    }

    // =====================================================================
    // 🔔 到價提醒
    // =====================================================================
    const PZ_STAGE_PRESETS = [10, 5, 3, 2, 1];
    // 分段價位（例如 600、700、800 各自提醒一次）；百分比快選會依目標價換算成價位加入
    function pzAlertLevels() { return (pzEditAlert && Array.isArray(pzEditAlert.levels)) ? pzEditAlert.levels : []; }
    function pzField(label, inner, cls = '') { return `<label class="flex flex-col gap-1 min-w-0 ${cls}"><span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">${label}</span>${inner}</label>`; }
    function pzWatchSelect(id, value, allowNone, onchange) {
      const ids = userWatchlist.filter(x => x);
      return `<select id="${id}" onchange="${onchange || ''}" class="${pzInput} w-full">${allowNone ? '<option value="">不指定股票</option>' : (ids.length ? '' : '<option value="">（關注清單是空的）</option>')}${ids.map(c => `<option value="${escHtml(c)}" ${c === value ? 'selected' : ''}>${escHtml(c)} ${escHtml(pzName(c))}</option>`).join('')}</select>`;
    }
    function pzTick(v) {   // 依台股升降單位取整
      const t = v < 10 ? 0.01 : v < 50 ? 0.05 : v < 100 ? 0.1 : v < 500 ? 0.5 : v < 1000 ? 1 : 5;
      return Math.round(Math.round(v / t) * t * 100) / 100;
    }
    function pzSortLevels(lv, cond) { return Array.from(new Set(lv)).sort((a, b) => cond === 'lte' ? b - a : a - b); }
    function pzSetLevels(lv) {
      const v = pzAlertFormValues();
      pzEditAlert = Object.assign(pzEditAlert || {}, v, { levels: pzSortLevels(lv, v.cond || 'gte').slice(0, 6) });
      renderPzAlerts();
    }
    function pzAddPctLevel(pct) {
      const v = pzAlertFormValues();
      if (!(v.price > 0)) { pzToast('請先輸入目標價，再用 % 快選', true); return; }
      const lv = pzTick(v.cond === 'lte' ? v.price * (1 + pct / 100) : v.price * (1 - pct / 100));
      if (pzAlertLevels().length >= 6) { pzToast('分段價位最多 6 個', true); return; }
      pzSetLevels(pzAlertLevels().concat(lv));
    }
    function pzAddLevel() {
      const el = document.getElementById('pzA_level');
      const lv = Math.round(parseFloat(el.value) * 100) / 100;
      if (!(lv > 0)) { pzToast('請輸入價位', true); return; }
      if (pzAlertLevels().length >= 6) { pzToast('分段價位最多 6 個', true); return; }
      pzSetLevels(pzAlertLevels().concat(lv));
    }
    function pzRemoveLevel(lv) { pzSetLevels(pzAlertLevels().filter(x => x !== lv)); }
    // 預覽：各分段價位與目標價（距目標 %、目前是否已到）
    function pzStagePreview() {
      const el = document.getElementById('pzA_preview'); if (!el) return;
      const price = parseFloat((document.getElementById('pzA_price') || {}).value);
      const cond = (document.getElementById('pzA_cond') || {}).value || 'gte';
      const code = (document.getElementById('pzA_code') || {}).value || '';
      const st = stockMap.get(code);
      const cur = st ? st.price : null;
      const sym = cond === 'lte' ? '≤' : '≥';
      const fmt = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
      const reached = x => cur !== null && (cond === 'lte' ? cur <= x : cur >= x);
      const levels = pzSortLevels(pzAlertLevels(), cond);
      const bad = levels.filter(x => price > 0 && (cond === 'lte' ? x < price : x > price));
      const chip = (x, k) => `<span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg border ${reached(x) ? 'border-amber-500/50 bg-amber-500/10 text-amber-700 dark:text-amber-300' : 'border-slate-200 dark:border-slate-700'} font-mono text-[11px]">
          <span class="text-slate-400 font-sans">第 ${k + 1} 段</span> ${sym} <b>${fmt(x)}</b>${price > 0 ? `<span class="text-slate-400 font-sans">距目標 ${((cond === 'lte' ? x - price : price - x) / price * 100).toFixed(1)}%</span>` : ''}
          <button type="button" onclick="pzRemoveLevel(${x})" class="text-slate-400 hover:text-rose-500" title="移除"><i class="fa-solid fa-xmark"></i></button></span>`;
      el.innerHTML = `<div class="flex flex-wrap items-center gap-1.5">
          ${levels.map(chip).join('<i class="fa-solid fa-angle-right text-slate-300 text-[10px]"></i>')}
          ${levels.length ? '<i class="fa-solid fa-angle-right text-slate-300 text-[10px]"></i>' : '<span class="text-slate-400">尚未設定分段價位（只在到目標價時通知）</span>'}
          ${price > 0 ? `<span class="px-2 py-1 rounded-lg border ${reached(price) ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300' : 'border-brand-500/40'} font-mono text-[11px]"><span class="text-slate-400 font-sans">目標價</span> ${sym} <b>${fmt(price)}</b></span>` : ''}
        </div>
        ${bad.length ? `<div class="mt-1.5 text-[10px] text-amber-600">⚠ ${bad.map(fmt).join('、')} 已超過目標價，會比目標價更晚觸發；一般分段價位應介於現價與目標價之間。</div>` : ''}
        ${cur !== null && price > 0 ? `<div class="mt-1.5 text-[10px] text-slate-500">目前 ${fmt(cur)}，距目標 ${((cond === 'lte' ? cur - price : price - cur) / price * 100).toFixed(2)}%${levels.some(reached) || reached(price) ? '（已有價位達到，下次盤中檢查就會通知）' : ''}</div>` : ''}`;
    }
    function pzAlertFormValues() {
      const g = id => (document.getElementById(id) || {}).value;
      const o = {};
      if (g('pzA_code') !== undefined) o.code = g('pzA_code');
      if (g('pzA_cond') !== undefined) o.cond = g('pzA_cond');
      if (g('pzA_price')) o.price = parseFloat(g('pzA_price'));
      if (g('pzA_note') !== undefined) o.note = g('pzA_note');
      return o;
    }
    function renderPzAlerts() {
      const box = document.getElementById('tabAlerts');
      if (!box || pzNeedToken('tabAlerts')) return;
      if (!pzState.loaded) { box.innerHTML = jnCard(pzStatusHtml() || ''); pzLoad(false); return; }
      const f = pzEditAlert || { cond: 'gte', levels: [] };
      const list = pzState.alerts.slice().sort((a, b) => a.code.localeCompare(b.code));
      const stageBtn = pct => `<button type="button" onclick="pzAddPctLevel(${pct})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border border-slate-200 dark:border-slate-700 text-slate-500 hover:border-brand-500 hover:text-brand-600 transition">${f.cond === 'lte' ? '+' : '−'}${pct}%</button>`;
      box.innerHTML = pzCodeDatalist() + pzCard(`
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-slate-100"><i class="fa-solid fa-bell text-amber-500 mr-1.5"></i>到價提醒</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">盤中每 10 分鐘檢查；可設定多個分段價位（例如 600、700、800），到達每個價位各寄一次，到目標價再寄一次（每天各一次）。</p>
          </div>
          <label class="flex items-center gap-2 cursor-pointer select-none rounded-xl border ${pzState.settings.emailAlerts ? 'border-emerald-500/40 bg-emerald-500/5' : 'border-slate-200 dark:border-slate-700'} px-3 py-2">
            <input type="checkbox" ${pzState.settings.emailAlerts ? 'checked' : ''} onchange="pzSetEmail(this.checked)" class="w-4 h-4 accent-emerald-600">

          <div class="flex justify-end gap-2">${f.id || f.code ? `<button onclick="pzEditAlert=null; renderPzAlerts()" class="${pzBtnGhost}">取消</button>` : ''}<button onclick="pzSaveAlert()" class="${pzBtn}">${f.id ? '儲存修改' : '新增提醒'}</button></div>
        </div>
        ${list.length ? `<div class="space-y-3">${list.map(a => {
          const st = stockMap.get(a.code); const px = st ? st.price : null;

          const sym = a.cond === 'lte' ? '≤' : '≥';
          const at = pct => a.cond === 'lte' ? a.price * (1 + pct / 100) : a.price * (1 - pct / 100);
          const fmt = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
          const today = pfToday();
          const status = a.lastHit === today ? '<span class="text-emerald-600 font-bold">今日已到價</span>'
            : (a.notifiedDate === today && (a.notified || []).length ? `<span class="text-amber-600 font-bold">今日已通知 ${a.notified.length} 段</span>` : (a.enabled ? '<span class="text-slate-500">監控中</span>' : '<span class="text-slate-400">已停用</span>'));
          return `<div class="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 ${a.enabled ? '' : 'opacity-60'}">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="min-w-0"><b class="text-sm">${escHtml(a.name || pzName(a.code) || a.code)}</b> <span class="font-mono text-[10px] text-slate-400">${escHtml(a.code)}</span>${a.note ? ` <span class="text-[10px] text-slate-500">・${escHtml(a.note)}</span>` : ''}</div>
              <div class="flex items-center gap-2 text-[11px]">${status}

                <button onclick="pzDelete('deleteAlert','${a.id}')" class="${pzBtnGhost}">刪除</button></div>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5 font-mono text-[11px]">
              ${(a.levels || []).map(x => { const ok = a.notifiedDate === today && (a.notified || []).includes(x); return `<span class="px-1.5 py-0.5 rounded border ${ok ? 'border-amber-500/50 bg-amber-500/10' : 'border-slate-200 dark:border-slate-700'}">${sym} ${fmt(x)}${ok ? ' <i class="fa-solid fa-check text-amber-600"></i>' : ''}</span>`; }).join('<i class="fa-solid fa-angle-right text-slate-300 text-[9px]"></i>')}

            </div>
          </div>`;
        }).join('')}</div>` : '<div class="py-6 text-center text-xs text-slate-400">尚未設定任何提醒；也可以在關注卡片的個股詳情中按「到價提醒」</div>'}
        <p class="text-[10px] text-slate-400">現價為試算表最新資料；提醒以證交所即時行情判斷（約 20 秒延遲）。僅供參考，不構成投資建議。</p>`);

    function pzAlertCodeChanged() {
      const code = document.getElementById('pzA_code').value;

      document.getElementById('pzA_name').textContent = s ? `${s.name}・現價 ${s.price}` : '';
      document.getElementById('pzA_unlisted').innerHTML = code.length >= 4 ? pzUnlistedHtml(code, 'pzA_req') : '';
      pzStagePreview();
    }
    async function pzSetEmail(on) {
      try { const r = await pzPost('saveSettings', { emailAlerts: on }); if (r.success) { pzState.settings.emailAlerts = on; pzToast(on ? '已開啟寄信提醒' : '已關閉寄信提醒'); } else pzToast(r.message || '設定失敗', true); }
      catch (e) { pzToast(e.message, true); }
      renderPzAlerts();
    }
    async function pzSaveAlert() {
      const v = pzAlertFormValues();
      if (!/^[0-9A-Z]{4,6}$/.test(v.code || '')) { pzToast('請輸入正確的股票代號', true); return; }
      if (!(v.price > 0)) { pzToast('請輸入目標價', true); return; }
      const payload = { id: pzEditAlert && pzEditAlert.id, code: v.code, name: pzName(v.code), cond: v.cond, price: v.price, levels: pzAlertLevels(), note: v.note, enabled: pzEditAlert && pzEditAlert.id ? pzEditAlert.enabled !== false : true };
      try {
        const r = await pzPost('saveAlert', payload);
        if (!r.success) { pzToast(r.message || '儲存失敗', true); return; }
        pzToast(pzState.settings.emailAlerts ? '已儲存提醒' : '已儲存（記得開啟寄信提醒）');
        pzEditAlert = null; await pzLoad(true);
      } catch (e) { pzToast(e.message, true); }
    }
    async function pzToggleAlert(id) {
      const a = pzState.alerts.find(x => x.id === id); if (!a) return;
      try { const r = await pzPost('saveAlert', { ...a, enabled: !a.enabled }); if (!r.success) pzToast(r.message, true); await pzLoad(true); } catch (e) { pzToast(e.message, true); }
    }
    async function pzDelete(action, id) {
      if (!confirm('確定刪除？')) return;
      try { const r = await pzPost(action, { id }); if (!r.success) pzToast(r.message || '刪除失敗', true); await pzLoad(true); } catch (e) { pzToast(e.message, true); }
    }

    // =====================================================================
    // 📌 長期追蹤
    // =====================================================================
    let pzTrackRange = 120;
    function pzSetTrackRange(v) { pzTrackRange = Number(v); renderPzTrack(); }
    function renderPzTrack() {
      const box = document.getElementById('tabTrack');
      if (!box || pzNeedToken('tabTrack')) return;
      if (!pzState.loaded) { box.innerHTML = jnCard(pzStatusHtml() || ''); pzLoad(false); return; }
      const tracks = pzState.tracks;
      if (!pzTrackSel || !tracks.some(t => t.code === pzTrackSel)) pzTrackSel = tracks[0] ? tracks[0].code : '';
      const hist = pzState.history[pzTrackSel] || [];
      const first = hist[0], last = hist[hist.length - 1];
      const chg = first && last ? (last.close / first.close - 1) * 100 : null;
      box.innerHTML = pzCodeDatalist() + pzCard(`
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-slate-100"><i class="fa-solid fa-thumbtack text-brand-500 mr-1.5"></i>長期追蹤</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">每個交易日收盤後自動記錄開盤、最高、最低、收盤、漲跌幅與成交量（K 線），從加入當天開始累積。</p>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto"><div class="flex-1 sm:w-56">${pzWatchSelect('pzT_code', '', false)}</div><button onclick="pzAddTrack()" class="${pzBtn}">加入追蹤</button></div>
        </div>
        <p class="text-[10px] text-slate-400 -mt-1">只能從「關注清單」挑選。同一檔股票全體會員共用同一份紀錄：若已有人先追蹤，加入後立刻看得到更早的歷史。</p>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5">${tracks.map(t => `<button onclick="pzTrackSel='${t.code}'; renderPzTrack()" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${t.code === pzTrackSel ? 'bg-brand-600 text-white border-brand-600' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}">${escHtml(t.name || pzName(t.code) || t.code)} <span class="font-mono opacity-70">${escHtml(t.code)}</span></button>`).join('') || '<span class="text-xs text-slate-400">尚未追蹤任何股票</span>'}</div>
          ${pzTierLine('track', tracks.length)}
        </div>
        ${pzTrackSel ? `
          <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
            <span>你自 ${escHtml((tracks.find(t => t.code === pzTrackSel) || {}).since || '--')} 開始追蹤・共享紀錄 <b>${hist.length}</b> 天${first ? `（最早 ${escHtml(first.date)}）` : ''}${(pzState.trackUsers || {})[pzTrackSel] > 1 ? `・${pzState.trackUsers[pzTrackSel]} 位會員共用` : ''}${chg !== null ? `・期間漲跌 <b class="${chg > 0 ? 'text-stockRed' : (chg < 0 ? 'text-stockGreen' : '')}">${chg > 0 ? '+' : ''}${chg.toFixed(2)}%</b>` : ''}</span>
            <button onclick="if(confirm('取消追蹤？已記錄的歷史仍會保留在後端')) pzToggleTrack('${pzTrackSel}', true)" class="${pzBtnGhost}">取消追蹤</button>
          </div>
          ${hist.length >= 2 ? `<div class="flex items-center justify-end gap-2 -mb-1">${jnSeg(pzTrackRange, [[60, '60日'], [120, '120日'], [0, '全部']], 'pzSetTrackRange')}</div>${chartBox('pz_track_k', 'K 線＋成交量（張）', hist.some(h => !(h.open > 0)) ? '虛線框的 K 棒缺開盤價，以前一日收盤近似' : '', false)}` : '<div class="py-6 text-center text-xs text-slate-400">資料累積中：收盤後會自動記錄，至少兩天後顯示走勢圖</div>'}
          ${hist.length ? `<div class="max-h-[280px] overflow-y-auto rounded-xl border border-slate-200 dark:border-slate-800"><table class="w-full text-xs font-mono"><thead class="sticky top-0 bg-slate-100 dark:bg-slate-950 text-[10px] text-slate-500"><tr><th class="py-1.5 px-2 text-left">日期</th><th class="text-right px-2">開盤</th><th class="text-right px-2">最高</th><th class="text-right px-2">最低</th><th class="text-right px-2">收盤</th><th class="text-right px-2">漲跌幅</th><th class="text-right px-2">成交量</th></tr></thead><tbody>
            ${hist.slice().reverse().map(h => { const nv = v => (v === null || v === undefined || isNaN(v)) ? '--' : v; return `<tr class="border-t border-slate-100 dark:border-slate-800/60"><td class="py-1 px-2">${h.date}</td><td class="text-right px-2">${nv(h.open)}</td><td class="text-right px-2">${nv(h.high)}</td><td class="text-right px-2">${nv(h.low)}</td><td class="text-right px-2 font-bold">${h.close}</td><td class="text-right px-2 ${h.pct > 0 ? 'text-stockRed' : (h.pct < 0 ? 'text-stockGreen' : '')}">${(h.pct === null || h.pct === undefined || isNaN(h.pct)) ? '--' : (h.pct > 0 ? '+' : '') + h.pct.toFixed(2) + '%'}</td><td class="text-right px-2">${(h.vol === null || h.vol === undefined || isNaN(h.vol)) ? '--' : h.vol.toLocaleString()}</td></tr>`; }).join('')}
          </tbody></table></div>` : ''}` : ''}`);
      if (hist.length >= 2) {
        const kEl = document.getElementById('pz_track_k'); if (kEl) kEl.className = 'relative w-full h-[300px] sm:h-[360px]';
        const H = pzTrackRange ? hist.slice(-pzTrackRange) : hist;
        candleChart('pz_track_k', H);
        const L = H[H.length - 1], hiB = H.reduce((a, h) => (h.high || h.close) > (a.high || a.close) ? h : a, H[0]), loB = H.reduce((a, h) => (h.low || h.close) < (a.low || a.close) ? h : a, H[0]);
        const vv = H.map(h => h.vol).filter(v => v > 0), avgV = vv.length ? vv.reduce((a, b) => a + b, 0) / vv.length : null;
        setChartNote('pz_track_k', [
          ['區間最高', `${hiB.high || hiB.close}（${hiB.date.slice(5)}）`, 'text-stockRed'],
          ['區間最低', `${loB.low || loB.close}（${loB.date.slice(5)}）`, 'text-stockGreen'],
          ['區間漲跌', jnPct((L.close / H[0].close - 1) * 100), jnCol(L.close - H[0].close)],
          avgV ? ['均量', Math.round(avgV).toLocaleString() + ' 張'] : null,
          avgV && L.vol > 0 ? ['最新量／均量', (L.vol / avgV).toFixed(2) + ' 倍', L.vol > avgV * 1.5 ? 'text-stockRed' : ''] : null
        ]);
      }
    }
    async function pzAddTrack() {
      const code = (document.getElementById('pzT_code').value || '').trim();
      if (!code) { pzToast('請先到關注清單加入股票', true); return; }
      if (pzState.tracks.some(t => t.code === code)) { pzTrackSel = code; renderPzTrack(); return; }
      pzTrackSel = code;
      await pzToggleTrack(code, true);
    }

    // =====================================================================
    // 📝 投資筆記
    // =====================================================================
    function renderPzNotes() {
      const box = document.getElementById('tabNotes');
      if (!box || pzNeedToken('tabNotes')) return;
      if (!pzState.loaded) { box.innerHTML = jnCard(pzStatusHtml() || ''); pzLoad(false); return; }
      const f = pzEditNote || { type: '觀察' };
      const q = pzNoteFilter.toLowerCase();
      const list = pzState.notes.filter(n => !q || [n.code, n.name, n.type, n.content].join(' ').toLowerCase().includes(q))
        .sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created));
      const typeCol = t => ({ '買進理由': 'bg-red-500/10 text-red-600', '賣出檢討': 'bg-emerald-500/10 text-emerald-600', '心得': 'bg-indigo-500/10 text-indigo-600', '事件': 'bg-amber-500/10 text-amber-600' }[t] || 'bg-slate-500/10 text-slate-600 dark:text-slate-300');
      box.innerHTML = pzCodeDatalist() + pzCard(`
        <div>
          <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-slate-100"><i class="fa-solid fa-pen text-emerald-500 mr-1.5"></i>投資筆記</h3>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">記下觀察、買進理由與賣出檢討，之後回頭看最有價值。股票從關注清單挑選，也可「不指定股票」寫大盤心得。</p>
        </div>
        <div class="rounded-2xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 space-y-3">
          <div class="text-xs font-black text-slate-700 dark:text-slate-200">${f.id ? '編輯筆記' : '新增筆記'}</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            ${pzField('日期', `<input id="pzN_date" type="date" value="${escHtml(f.date || pfToday())}" class="${pzInput} w-full">`)}
            ${pzField('股票（關注清單）', pzWatchSelect('pzN_code', f.code || '', true))}
            ${pzField('類型', `<select id="pzN_type" class="${pzInput} w-full">${PZ_NOTE_TYPES.map(t => `<option ${t === f.type ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
          </div>
          ${pzField('內容', `<textarea id="pzN_content" rows="4" maxlength="2000" placeholder="例：法說會提到 AI 伺服器訂單能見度到明年；若回測月線可分批布局" class="${pzInput} w-full leading-relaxed">${escHtml(f.content || '')}</textarea>`)}
          <div class="flex justify-end gap-2">${f.id || f.code ? `<button onclick="pzEditNote=null; renderPzNotes()" class="${pzBtnGhost}">取消</button>` : ''}<button onclick="pzSaveNote()" class="${pzBtn}">${f.id ? '儲存修改' : '新增筆記'}</button></div>
        </div>
        <div class="flex items-center justify-between gap-2"><input value="${escHtml(pzNoteFilter)}" oninput="pzNoteFilter=this.value; clearTimeout(window._pzNf); window._pzNf=setTimeout(renderPzNotes, 300)" placeholder="搜尋筆記 / 代號 / 類型" class="${pzInput} w-full sm:w-64"><span class="text-[10px] text-slate-400 shrink-0">共 ${pzState.notes.length} 則</span></div>
        <div class="space-y-3">${list.map(n => `
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
            <div class="flex items-center justify-between gap-2 text-[11px]">
              <div class="flex items-center gap-2 min-w-0"><span class="font-mono text-slate-500">${escHtml(n.date)}</span><span class="px-1.5 py-0.5 rounded font-bold ${typeCol(n.type)}">${escHtml(n.type)}</span>${n.code ? `<b class="truncate">${escHtml(n.name || pzName(n.code) || '')} <span class="font-mono text-slate-400">${escHtml(n.code)}</span></b>` : ''}</div>
              <div class="shrink-0"><button onclick="pzEditNote=Object.assign({}, pzState.notes.find(x=>x.id==='${n.id}')); renderPzNotes(); window.scrollTo({top:0,behavior:'smooth'})" class="${pzBtnGhost}">編輯</button> <button onclick="pzDelete('deleteNote','${n.id}')" class="${pzBtnGhost}">刪除</button></div>
            </div>
            <div class="mt-2 text-xs leading-relaxed text-slate-700 dark:text-slate-200 whitespace-pre-wrap">${escHtml(n.content)}</div>
          </div>`).join('') || '<div class="py-6 text-center text-xs text-slate-400">還沒有筆記</div>'}</div>`);
    }
    async function pzSaveNote() {
      const content = document.getElementById('pzN_content').value.trim();
      const code = document.getElementById('pzN_code').value.trim();
      if (!content) { pzToast('請輸入內容', true); return; }

      try {
        const r = await pzPost('saveNote', { id: pzEditNote && pzEditNote.id, date: document.getElementById('pzN_date').value, code, name: pzName(code), type: document.getElementById('pzN_type').value, content });
        if (!r.success) { pzToast(r.message || '儲存失敗', true); return; }
        pzToast('已儲存筆記'); pzEditNote = null; await pzLoad(true);
      } catch (e) { pzToast(e.message, true); }

    // =====================================================================
    // 📒 手動投資日誌（預設；有自己的試算表可改用連結）
    // =====================================================================
    function pzFee(amount) { return Math.max(20, Math.round(amount * 0.001425)); }
    function pzTax(code, amount) { return Math.round(amount * (/^00/.test(code) ? 0.001 : 0.003)); }
    function pzPortfolio() {
      const pos = {}; let realized = 0;
      pzState.trades.slice().sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0)).forEach(t => {
        const p = pos[t.code] = pos[t.code] || { code: t.code, name: t.name || pzName(t.code), shares: 0, cost: 0, realized: 0, buys: 0 };
        if (t.side === '賣出') {
          const q = Math.min(t.shares, p.shares), avg = p.shares > 0 ? p.cost / p.shares : 0;
          const r = t.price * q - t.fee - t.tax - avg * q;
          p.realized += r; realized += r; p.cost -= avg * q; p.shares -= q;
        } else { p.shares += t.shares; p.cost += t.shares * t.price + t.fee; p.buys++; }
      });
      const holdings = Object.values(pos).map(p => {
        const s = stockMap.get(p.code);
        const px = s ? s.price : null;
        const value = px !== null && p.shares > 0 ? px * p.shares : null;
        return { ...p, name: p.name || (s && s.name) || p.code, price: px, value, unreal: value !== null ? value - p.cost : null, avg: p.shares > 0 ? p.cost / p.shares : 0, listed: !!s, dayPct: s ? s.pctNum : null };
      });
      return { holdings, realized };
    }

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">

    function pzTradeCalc(fromInput) {
      const code = (document.getElementById('pzJ_code') || {}).value || '';
      const side = document.getElementById('pzJ_side').value;
      const sh = parseFloat(document.getElementById('pzJ_shares').value), px = parseFloat(document.getElementById('pzJ_price').value);
      const nm = document.getElementById('pzJ_name'); if (nm) nm.textContent = pzName(code);
      const un = document.getElementById('pzJ_unlisted'); if (un && fromInput) un.innerHTML = code.length >= 4 ? pzUnlistedHtml(code, 'pzJ_req') : '';
      const amt = sh > 0 && px > 0 ? sh * px : 0;
      const feeEl = document.getElementById('pzJ_fee'), taxEl = document.getElementById('pzJ_tax');
      if (amt && !feeEl.dataset.manual && !(pzEditTrade && pzEditTrade.id && !fromInput)) feeEl.value = pzFee(amt);
      if (amt && !taxEl.dataset.manual && !(pzEditTrade && pzEditTrade.id && !fromInput)) taxEl.value = side === '賣出' ? pzTax(code, amt) : 0;
      const a = document.getElementById('pzJ_amt'); if (a) a.textContent = amt ? jnFmt(amt) : '--';
    }
    async function pzSaveTrade() {
      const g = id => document.getElementById(id).value;
      const code = g('pzJ_code').trim();
      if (!/^[0-9A-Z]{4,6}$/.test(code)) { pzToast('請輸入正確的股票代號', true); return; }
      const shares = parseInt(g('pzJ_shares'), 10), price = parseFloat(g('pzJ_price'));
      if (!(shares > 0) || !(price > 0)) { pzToast('請輸入股數與價格', true); return; }
      if (g('pzJ_side') === '賣出') {
        const held = (pzPortfolio().holdings.find(h => h.code === code) || { shares: 0 }).shares + (pzEditTrade && pzEditTrade.id && pzEditTrade.side === '賣出' ? pzEditTrade.shares : 0);
        if (shares > held && !confirm(`目前紀錄持有 ${held} 股，賣出 ${shares} 股超過持股，仍要儲存嗎？`)) return;
      }
      try {
        const r = await pzPost('saveTrade', { id: pzEditTrade && pzEditTrade.id, date: g('pzJ_date'), code, name: pzName(code), side: g('pzJ_side'), shares, price, fee: parseFloat(g('pzJ_fee')) || 0, tax: parseFloat(g('pzJ_tax')) || 0, reason: g('pzJ_reason'), note: g('pzJ_note') });
        if (!r.success) { pzToast(r.message || '儲存失敗', true); return; }
        pzToast('已記錄'); pzEditTrade = null; journalState.manualForm = false; await pzLoad(true);
      } catch (e) { pzToast(e.message, true); }
    }
